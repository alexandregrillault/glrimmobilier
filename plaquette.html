<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Présentation — GLR Immobilier</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --ink:#161A1E; --teal:#005875; --muted:#616B75; --gold:#8A6A2F; --gold-light:#C6A063;
    --cream:#F3EFE6; --cream2:#EAE6DD; --white:#FFFFFF; --line:#DCD6C6;
    --serif:Cambria,Georgia,'Times New Roman',serif;
    --sans:Calibri,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow:hidden}
  body.scroll-mode{overflow:auto;background:var(--cream)}

  #progress{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:60;transition:width .45s cubic-bezier(.65,0,.35,1)}

  #deck{position:relative;width:100%;height:100vh;background:var(--cream);overflow:hidden}
  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;
    background:var(--cream);padding:min(9vh,74px) min(9vw,90px) min(9vh,60px);overflow-y:auto;
    transform:translateX(100%);opacity:0;transition:transform .5s cubic-bezier(.65,0,.35,1),opacity .4s ease;
  }
  .slide.prev{transform:translateX(-100%);opacity:0}
  .slide.active{transform:translateX(0);opacity:1;z-index:2}
  body.scroll-mode .slide{position:static;transform:none !important;opacity:1 !important;display:flex !important;min-height:100vh;border-bottom:1px solid var(--line)}

  .slide .reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
  .slide.active .reveal{opacity:1;transform:translateY(0)}
  .slide.active .reveal:nth-child(1){transition-delay:.05s}
  .slide.active .reveal:nth-child(2){transition-delay:.12s}
  .slide.active .reveal:nth-child(3){transition-delay:.19s}
  .slide.active .reveal:nth-child(4){transition-delay:.26s}
  .slide.active .reveal:nth-child(5){transition-delay:.33s}

  .eyebrow{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:'';width:22px;height:2px;background:var(--gold-light)}
  h1{font-family:var(--serif);font-size:clamp(28px,4vw,48px);font-weight:700;margin-top:14px;line-height:1.16;color:var(--ink)}
  h2{font-family:var(--serif);font-size:clamp(23px,3.2vw,32px);font-weight:700;margin-top:10px;line-height:1.2;color:var(--ink)}
  .lead{font-size:clamp(14px,1.4vw,16.5px);color:var(--muted);margin-top:14px;max-width:640px;line-height:1.6}
  .content{margin-top:clamp(22px,3.5vh,34px);max-width:960px;width:100%}

  .pour{font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);color:var(--teal);font-weight:700;margin-top:6px}
  .date-badge{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:16px;letter-spacing:.3px}

  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(138,106,47,.08);border:1px solid var(--gold-light);color:var(--gold);
    font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:20px;padding:6px 14px}
  .conseiller-block{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:14px}
  .conseiller-av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:none}
  .conseiller-nom{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
  .conseiller-sub{font-size:11.5px;color:var(--muted)}

  table.comparatif{width:100%;border-collapse:collapse;margin-top:4px;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(22,26,30,.08)}
  table.comparatif th,table.comparatif td{padding:14px 18px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line)}
  table.comparatif thead th{font-family:var(--serif);font-size:13px;background:var(--ink);color:var(--white);font-weight:700}
  table.comparatif thead th:first-child{color:#aab0b6;font-weight:400}
  table.comparatif tbody th{color:var(--muted);font-weight:600;white-space:nowrap}
  table.comparatif tbody td:nth-child(3){color:var(--teal);font-weight:700}
  table.comparatif tr:last-child td,table.comparatif tr:last-child th{border-bottom:none}

  .grid{display:grid;gap:14px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  @media (max-width:820px){.grid.g3,.grid.g4{grid-template-columns:1fr}}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(22,26,30,.05)}
  .card .icowrap{width:34px;height:34px;border-radius:9px;background:rgba(0,88,117,.08);display:flex;align-items:center;justify-content:center;color:var(--teal)}
  .card h3{font-family:var(--serif);font-size:15.5px;font-weight:700;margin-top:12px;color:var(--ink)}
  .card p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}

  .zero-wrap{display:flex;align-items:baseline;gap:16px}
  .zero{font-family:var(--serif);font-weight:700;font-size:clamp(72px,11vw,132px);color:var(--teal);line-height:1}
  .zero-label{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

  ol.steps{list-style:none;margin-top:4px;display:grid;gap:13px}
  ol.steps li{display:flex;gap:15px;align-items:flex-start}
  ol.steps .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--white);border:1.5px solid var(--gold-light);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px}
  ol.steps h3{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink)}
  ol.steps p{font-size:12.5px;color:var(--muted);margin-top:2px}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:4px}
  @media (max-width:820px){.cols2{grid-template-columns:1fr}}
  .cols2 h3{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--teal);margin-bottom:10px}
  .cols2 ul{list-style:none;display:grid;gap:9px}
  .cols2 li{font-size:13px;padding-left:18px;position:relative}
  .cols2 li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

  .cta-sim{display:inline-flex;align-items:center;gap:10px;margin-top:24px;background:var(--ink);color:var(--white);
    border:none;border-radius:12px;padding:14px 22px;font-family:var(--sans);font-size:14px;font-weight:700;
    cursor:pointer;text-decoration:none;transition:transform .15s ease}
  .cta-sim:hover{transform:translateY(-1px)}
  .cta-sim .arrow{font-family:var(--serif);font-weight:400}
  .cta-sim-sub{margin-top:10px;font-size:11.5px;color:var(--muted)}

  /* Diapo carte */
  .map-wrap{position:relative;width:100%;height:min(52vh,480px);border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px rgba(22,26,30,.1);background:var(--white)}
  .map-wrap iframe{width:100%;height:100%;border:0;display:block}
  .map-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:20px}
  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .stat-chip{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:baseline;gap:7px}
  .stat-chip b{font-family:var(--serif);font-size:19px;color:var(--teal)}
  .stat-chip span{font-size:11.5px;color:var(--muted)}
  .map-villes{font-size:12px;color:var(--muted);margin-top:8px}
  .map-villes b{color:var(--ink)}

  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px;max-width:640px}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
  .contact-grid .k{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .contact-grid .v{font-size:15px;font-weight:700;margin-top:4px;color:var(--ink)}
  .legal{margin-top:auto;padding-top:24px;font-size:10.5px;color:var(--muted);max-width:720px;line-height:1.6}

  .num-badge{position:absolute;bottom:20px;right:min(9vw,90px);font-size:11px;color:var(--muted);letter-spacing:.5px}
  .logo-mark{position:absolute;top:26px;left:min(9vw,90px);height:24px;width:auto}

  #ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;z-index:50;pointer-events:none}
  #ctrl > *{pointer-events:auto}
  body.scroll-mode #ctrl{position:fixed}
  .ctrl-btn{background:rgba(22,26,30,.86);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:20px;
    padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);backdrop-filter:blur(6px)}
  .ctrl-btn:hover{background:rgba(22,26,30,.98)}
  #pageInd{color:#fff;font-size:12px;background:rgba(22,26,30,.86);border-radius:20px;padding:9px 14px;min-width:52px;text-align:center}

  @media print{
    body{overflow:visible !important;background:#fff}
    #ctrl,#progress{display:none !important}
    .slide{position:static !important;transform:none !important;opacity:1 !important;display:flex !important;height:100vh;page-break-after:always;overflow:visible}
    .slide:last-child{page-break-after:auto}
    .slide .reveal{opacity:1 !important;transform:none !important}
  }
  @media (max-width:640px){
    .slide{padding:58px 20px 90px}
    .contact-grid{grid-template-columns:1fr}
    .grid.g3,.grid.g4{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>

<div id="ctrl">
  <button class="ctrl-btn" id="btnPrev" onclick="goTo(current-1)" title="Précédent (←)">‹ Précédent</button>
  <span id="pageInd">1 / 1</span>
  <button class="ctrl-btn" id="btnNext" onclick="goTo(current+1)" title="Suivant (→)">Suivant ›</button>
  <button class="ctrl-btn" onclick="toggleFullscreen()" title="Plein écran">⛶ Plein écran</button>
  <button class="ctrl-btn" onclick="window.print()" title="Imprimer / PDF">Imprimer</button>
</div>

<script>
(function(){
  var LOGO_SRC = /glrimmobilier\.com$/i.test(location.hostname) ? "/selection/logo-glr.png" : "logo-glr.png";

  var qs = new URLSearchParams(location.search);
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  var conseillerPrenom = (qs.get('cp') || '').trim();
  var conseillerNom = (qs.get('cn') || '').trim();
  var conseillerNomComplet = (conseillerPrenom + ' ' + conseillerNom).trim();
  var conseillerEmail = (qs.get('ce') || '').trim();
  var conseillerTel = (qs.get('ct') || '').trim();
  var civilite = (qs.get('civ') || '').trim();
  var clientNom = (qs.get('client') || '').trim();
  var clientLabel = (civilite && clientNom) ? (civilite + ' ' + clientNom) : '';
  var villesClient = (qs.get('villes') || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);

  var SUPABASE_URL = 'https://hydqfbxdtpmbuooexekp.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZHFmYnhkdHBtYnVvb2V4ZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODA3NDEsImV4cCI6MjA5NDg1Njc0MX0.ylton95WooAxVbIqdgYIaiW8E6lGlxEuKsLEe-hzU0g';

  var dateAuj = new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  function initiales(){
    var a = (conseillerPrenom||'').charAt(0), b = (conseillerNom||'').charAt(0);
    return (a+b).toUpperCase() || 'GLR';
  }
  function conseillerBlock(){
    if (!conseillerNomComplet) return '';
    return '<div class="conseiller-block reveal"><div class="conseiller-av">' + esc(initiales()) + '</div>' +
      '<div><div class="conseiller-nom">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub">Conseiller en immobilier neuf — GLR Immobilier</div></div></div>';
  }

  var slides = [];

  // 1. Couverture — le nom du client au premier plan
  slides.push({ html:
    '<div class="eyebrow reveal">GLR IMMOBILIER</div>' +
    '<h1 class="reveal">Votre projet dans le neuf,<br>accompagné du premier échange<br>à la remise des clés</h1>' +
    (clientLabel ? '<div class="pour reveal">Pour ' + esc(clientLabel) + '</div>' : '') +
    '<div class="date-badge reveal">' + esc(dateAuj) + '</div>' +
    conseillerBlock()
  });

  // 2. Comparatif
  slides.push({ html:
    '<div class="eyebrow reveal">POURQUOI GLR</div><h2 class="reveal">Le même prix, un accompagnement en plus</h2>' +
    '<div class="lead reveal">Le prix d’un bien neuf est fixé par le promoteur — il est identique, que vous passiez par nous ou en direct.</div>' +
    '<div class="content reveal"><table class="comparatif"><thead><tr><th></th><th>En direct avec le promoteur</th><th>Avec GLR</th></tr></thead><tbody>' +
    [['Prix du bien','Identique','Identique'],
     ['Choix de programmes','Un seul promoteur','L’ensemble du marché neuf'],
     ['Recherche après le 1ᵉʳ contact','Aucune','Veille automatique en continu'],
     ['Accompagnement','Standardisé','Un seul interlocuteur, sur mesure']]
    .map(function(r){ return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') +
    '</tbody></table></div>'
  });

  var ICONS = {
    independance:'<path d="M12 2 3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z"/>',
    etendue:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/>',
    veille:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3.2"/>',
    garantie:'<path d="M12 2 4 5v6c0 5.2 3.4 8.6 8 9.6 4.6-1 8-4.4 8-9.6V5l-8-3z"/><path d="M9 12l2 2 4-4"/>',
    notaire:'<path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-6h6v6"/>',
    perso:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',
    energie:'<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>'
  };
  function icon(name){ return '<svg class="icowrap" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name]||'') + '</svg>'; }

  // 3. Indépendance
  slides.push({ html:
    '<div class="eyebrow reveal">INDÉPENDANCE</div><h2 class="reveal">Un accès à tout le marché, pas à un seul promoteur</h2>' +
    '<div class="content reveal grid g3">' +
    [['independance','Indépendance','GLR n’est engagé avec aucun promoteur en particulier — le conseil porte sur ce qui vous correspond, jamais sur ce qu’il faut écouler.'],
     ['etendue','Étendue','Accès à l’ensemble des programmes commercialisés, tous promoteurs confondus, dans les secteurs que vous recherchez.'],
     ['veille','Veille automatique','Dès qu’un lot correspond à vos critères, vous êtes alerté — la recherche continue après ce rendez-vous, pas seulement pendant.']]
    .map(function(c){ return '<div class="card">' + icon(c[0]) + '<h3>' + esc(c[1]) + '</h3><p>' + esc(c[2]) + '</p></div>'; }).join('') +
    '</div>'
  });

  // 4. Honoraires
  slides.push({ html:
    '<div class="eyebrow reveal">TRANSPARENCE</div><h2 class="reveal">0€ d’honoraires pour vous</h2>' +
    '<div class="content reveal"><div class="zero-wrap"><div class="zero">0€</div><div class="zero-label">à la charge<br>du client</div></div>' +
    '<div class="lead" style="margin-top:22px">GLR est rémunéré par le promoteur, dans le cadre d’un mandat — exactement comme n’importe quel commercial qui vend un programme neuf.<br><br>Vous ne payez ni plus cher qu’en direct, ni de frais supplémentaires pour être accompagné.</div></div>'
  });

  // 5. Avantages du neuf
  slides.push({ html:
    '<div class="eyebrow reveal">VEFA</div><h2 class="reveal">Les avantages du neuf</h2>' +
    '<div class="content reveal grid g4">' +
    [['garantie','Garanties constructeur','Parfait achèvement, biennale, décennale — un logement couvert dès la livraison.'],
     ['notaire','Frais de notaire réduits','Environ 2 à 3 % dans le neuf, contre 7 à 8 % dans l’ancien.'],
     ['perso','Personnalisation','Cloisons, finitions et équipements choisis avant la livraison.'],
     ['energie','Performance énergétique','Normes actuelles (RE2020) : charges réduites et meilleur confort thermique.']]
    .map(function(c){ return '<div class="card">' + icon(c[0]) + '<h3>' + esc(c[1]) + '</h3><p>' + esc(c[2]) + '</p></div>'; }).join('') +
    '</div>'
  });

  // 6. Catalogue connecté à la carte en direct — la vraie carte, filtrée sur les
  // villes recherchées par le client quand on les connaît, sinon vue IDF complète.
  (function(){
    var criteres = villesClient.length ? JSON.stringify({ villes: villesClient }) : '';
    var mapSrc = 'carte.html' + (criteres ? '?criteres=' + encodeURIComponent(criteres) : '');
    slides.push({ html:
      '<div class="eyebrow reveal">NOTRE CATALOGUE</div><h2 class="reveal">Ce que nous avons actuellement en stock</h2>' +
      '<div class="lead reveal">Carte des programmes GLR, Île-de-France — données en temps réel' + (villesClient.length ? ', filtrée sur vos secteurs de recherche' : '') + '.</div>' +
      '<div class="content reveal">' +
      '<div class="map-wrap"><iframe src="' + esc(mapSrc) + '" loading="lazy" title="Carte des programmes GLR"></iframe></div>' +
      (villesClient.length ? '<div class="map-villes">Filtré sur : <b>' + esc(villesClient.join(', ')) + '</b></div>' : '') +
      '<div class="stat-strip">' +
      '<div class="stat-chip"><b id="statAvecLots">…</b><span>avec lots disponibles</span></div>' +
      '<div class="stat-chip"><b id="statTotal">…</b><span>programmes suivis</span></div>' +
      '<div class="stat-chip"><b id="statPromoteurs">…</b><span>promoteurs partenaires</span></div>' +
      '</div></div>'
    });
  })();

  // 7. Financement
  slides.push({ html:
    '<div class="eyebrow reveal">FINANCEMENT</div><h2 class="reveal">Le financement de votre projet</h2>' +
    '<div class="content reveal cols2">' +
    '<div><h3>Les dispositifs mobilisables</h3><ul>' +
    ['Prêt à Taux Zéro (PTZ)','Prêt Action Logement (ex-1 % patronal)','Prêt Paris Logement à 0 % (selon zone)','TVA réduite à 5,5 % (selon secteur et dispositif)']
    .map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
    '<div><h3>Comment GLR vous accompagne</h3><ul>' +
    ['Une première estimation de votre capacité, selon votre projet et votre zone','Un chiffrage détaillé une fois votre sélection de biens établie','Un partenaire courtier pour l’accord de principe bancaire']
    .map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
    '</div>' +
    '<div class="reveal"><a class="cta-sim" href="simulateur.html" target="_blank" rel="noopener">Faire la simulation maintenant <span class="arrow">→</span></a>' +
    '<div class="cta-sim-sub">On calcule ensemble votre capacité d’emprunt, avec les aides mobilisables.</div></div>'
  });

  // 8. Méthode
  slides.push({ html:
    '<div class="eyebrow reveal">NOTRE MÉTHODE</div><h2 class="reveal">Notre méthode, étape par étape</h2>' +
    '<div class="content reveal"><ol class="steps">' +
    [['Écoute','On comprend votre projet et vos critères — ville, budget, typologie, calendrier.'],
     ['Sélection','Une sélection personnalisée, construite sur l’ensemble du marché disponible.'],
     ['Visite & financement','Visite des biens retenus et simulation chiffrée de votre financement.'],
     ['Réservation','Montage du dossier et signature du contrat de réservation.'],
     ['Suivi','Accompagnement jusqu’à la remise des clés, et au-delà.']]
    .map(function(c,i){ return '<li><div class="n">' + (i+1) + '</div><div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div></li>'; }).join('') +
    '</ol></div>'
  });

  // 9. Étapes VEFA
  slides.push({ html:
    '<div class="eyebrow reveal">VEFA</div><h2 class="reveal">Les grandes étapes d’un achat dans le neuf</h2>' +
    '<div class="content reveal"><ol class="steps">' +
    [['Réservation','Signature du contrat de réservation préliminaire.'],
     ['Acte authentique','Offre de prêt puis signature chez le notaire — 1ᵉʳ appel de fonds.'],
     ['Construction','Appels de fonds selon l’avancement : fondations, hors d’eau, hors d’air, achèvement.'],
     ['Livraison','Remise des clés et vérifications contradictoires.'],
     ['Garanties','Parfait achèvement, biennale et décennale prennent le relais.']]
    .map(function(c,i){ return '<li><div class="n">' + (i+1) + '</div><div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div></li>'; }).join('') +
    '</ol></div>'
  });

  // 10. Contact
  slides.push({ html:
    '<div class="eyebrow reveal">GLR IMMOBILIER</div><h1 class="reveal">Restons en contact</h1>' +
    (conseillerNomComplet ? '<div class="conseiller-nom reveal" style="margin-top:16px;font-size:20px">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub reveal">Conseiller en immobilier neuf — GLR Immobilier</div>' : '') +
    '<div class="content reveal contact-grid">' +
    (conseillerTel ? '<div><div class="k">Téléphone</div><div class="v">' + esc(conseillerTel) + '</div></div>' : '') +
    (conseillerEmail ? '<div><div class="k">E-mail</div><div class="v">' + esc(conseillerEmail) + '</div></div>' : '') +
    '<div><div class="k">Site</div><div class="v">www.glrimmobilier.com</div></div>' +
    '</div>' +
    '<div class="lead reveal" style="margin-top:26px">Merci pour votre confiance.</div>' +
    '<div class="legal">GLR Immobilier — Carte professionnelle CPI 7501 2025 000 000 211 (CCI Paris Île-de-France) — RC Pro Allianz n° 64194122 — RCS Paris 933 789 612</div>'
  });

  var deck = document.getElementById('deck');
  slides.forEach(function(s, i){
    var div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = '<img class="logo-mark" alt="GLR Immobilier" onerror="this.style.display=\'none\'" src="' + LOGO_SRC + '">' +
      s.html + '<div class="num-badge">' + String(i+1).padStart(2,'0') + ' / ' + slides.length + '</div>';
    deck.appendChild(div);
  });

  var current = 0;
  window.current = 0;
  var nodes = deck.querySelectorAll('.slide');
  function goTo(i){
    if (i < 0 || i >= slides.length || i === current) return;
    var dir = i > current ? 1 : -1;
    nodes[current].classList.remove('active');
    nodes[current].classList.add(dir > 0 ? 'prev' : 'next');
    nodes[i].classList.remove('prev');
    // force reflow so the entering slide starts from the right side before animating in
    void nodes[i].offsetWidth;
    nodes[i].classList.add('active');
    current = i; window.current = i;
    document.getElementById('progress').style.width = (((current+1)/slides.length)*100) + '%';
    document.getElementById('pageInd').textContent = (current+1) + ' / ' + slides.length;
    document.getElementById('btnPrev').style.visibility = current === 0 ? 'hidden' : 'visible';
    document.getElementById('btnNext').style.visibility = current === slides.length-1 ? 'hidden' : 'visible';
    setTimeout(function(){ [...nodes].forEach(function(n,k){ if (k!==current) n.classList.remove('prev'); }); }, 550);
  }
  window.goTo = goTo;
  nodes[0].classList.add('active');
  document.getElementById('progress').style.width = (100/slides.length) + '%';
  document.getElementById('pageInd').textContent = '1 / ' + slides.length;
  document.getElementById('btnPrev').style.visibility = 'hidden';

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { goTo(current+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goTo(current-1); e.preventDefault(); }
    else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });
  deck.addEventListener('click', function(e){
    if (e.target.closest('.ctrl-btn, .cta-sim, .map-wrap, a, button, iframe') || document.body.classList.contains('scroll-mode')) return;
    var r = deck.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.7) goTo(current+1);
    else if (e.clientX - r.left < r.width * 0.3) goTo(current-1);
  });

  window.toggleFullscreen = function(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  };

  window.addEventListener('beforeprint', function(){ document.body.classList.add('scroll-mode'); });
  window.addEventListener('afterprint', function(){ document.body.classList.remove('scroll-mode'); });

  // Chiffres du catalogue en direct depuis la pige (fonction plaquette_stats, lecture anonyme)
  var statsCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  if (statsCtrl) setTimeout(function(){ statsCtrl.abort(); }, 6000);
  function compteA(el, to){
    var from = 0, dur = 900, t0 = null;
    function step(t){ if (!t0) t0 = t; var p = Math.min(1, (t - t0) / dur); var v = Math.round(from + (to - from) * (1 - Math.pow(1-p, 3)));
      el.textContent = v.toLocaleString('fr-FR'); if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  fetch(SUPABASE_URL + '/rest/v1/rpc/plaquette_stats', {
    method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}',
    signal: statsCtrl ? statsCtrl.signal : undefined
  }).then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
    if (!s) throw new Error('vide');
    compteA(document.getElementById('statAvecLots'), s.avec_lots);
    compteA(document.getElementById('statTotal'), s.total);
    compteA(document.getElementById('statPromoteurs'), s.promoteurs);
  }).catch(function(){
    ['statAvecLots','statTotal','statPromoteurs'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.textContent = '—';
    });
  });
})();
</script>
</body></html>
