<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Présentation — GLR Immobilier</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --ink:#161A1E; --teal:#005875; --muted:#616B75; --gold:#8A6A2F; --gold-light:#C6A063;
    --cream:#EAE6DD; --white:#FFFFFF; --line:#D8D2C4;
    --serif:Cambria,Georgia,'Times New Roman',serif;
    --sans:Calibri,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow:hidden}
  body.scroll-mode{overflow:auto}

  #deck{position:relative;width:100%;height:100vh}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    background:var(--cream);padding:min(7vh,64px) min(9vw,90px);overflow-y:auto;
  }
  .slide.active{display:flex}
  body.scroll-mode .slide{position:static;display:flex !important;min-height:100vh;border-bottom:1px solid var(--line)}
  .slide.cover, .slide.contact{background:var(--ink);color:var(--white)}
  .slide.stat{background:var(--teal);color:var(--white)}

  .eyebrow{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
  .slide.cover .eyebrow, .slide.contact .eyebrow, .slide.stat .eyebrow{color:var(--gold-light)}
  h1{font-family:var(--serif);font-size:clamp(26px,4.2vw,46px);font-weight:700;margin-top:10px;line-height:1.18}
  h2{font-family:var(--serif);font-size:clamp(22px,3.4vw,34px);font-weight:700;margin-top:8px;line-height:1.2}
  .lead{font-size:clamp(14px,1.5vw,17px);color:var(--muted);margin-top:14px;max-width:640px;line-height:1.6}
  .slide.cover .lead, .slide.contact .lead{color:#c9cdd2}
  .content{margin-top:clamp(20px,3.5vh,36px);max-width:900px}

  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(138,106,47,.12);border:1px solid var(--gold);color:var(--gold);
    font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:20px;padding:6px 14px;margin-top:22px}
  .slide.cover .pill, .slide.contact .pill{background:rgba(198,160,99,.12);border-color:var(--gold-light);color:var(--gold-light)}
  .conseiller-nom{font-family:var(--serif);font-size:20px;font-weight:700;margin-top:8px}
  .conseiller-sub{font-size:12.5px;color:var(--muted)}
  .slide.cover .conseiller-sub{color:#aeb4bb}

  table.comparatif{width:100%;border-collapse:collapse;margin-top:8px;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
  table.comparatif th,table.comparatif td{padding:13px 16px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line)}
  table.comparatif thead th{font-family:var(--serif);font-size:13px;background:var(--ink);color:var(--white);font-weight:700}
  table.comparatif thead th:first-child{color:#c9cdd2;font-weight:400}
  table.comparatif tbody th{color:var(--muted);font-weight:600;white-space:nowrap}
  table.comparatif tbody td:nth-child(3){color:var(--teal);font-weight:700}
  table.comparatif tr:last-child td,table.comparatif tr:last-child th{border-bottom:none}

  .grid{display:grid;gap:16px;margin-top:8px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  @media (max-width:820px){.grid.g3,.grid.g4{grid-template-columns:1fr}}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .card .num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--gold)}
  .card h3{font-family:var(--serif);font-size:16px;font-weight:700;margin-top:6px}
  .card p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.55}

  .stat-num{font-family:var(--serif);font-weight:700;font-size:clamp(64px,11vw,128px);line-height:1}
  .stat-label{font-size:clamp(14px,1.6vw,18px);margin-top:6px;max-width:520px}
  .stat-sub{margin-top:26px;font-size:14px;color:#cfe3e9;max-width:640px;line-height:1.6}
  .stat-sub b{color:var(--white)}
  .stat-note{margin-top:22px;font-size:13px;color:#a9c7ce;border-top:1px solid rgba(255,255,255,.25);padding-top:16px;max-width:640px}

  .zero{font-family:var(--serif);font-weight:700;font-size:clamp(70px,12vw,140px);color:var(--gold);line-height:1}
  .zero-label{font-size:14px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}

  ol.steps{list-style:none;margin-top:8px;display:grid;gap:14px}
  ol.steps li{display:flex;gap:16px;align-items:flex-start}
  ol.steps .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--white);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px}
  ol.steps h3{font-family:var(--serif);font-size:15.5px;font-weight:700}
  ol.steps p{font-size:13px;color:var(--muted);margin-top:2px}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
  @media (max-width:820px){.cols2{grid-template-columns:1fr}}
  .cols2 h3{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--teal);margin-bottom:10px}
  .cols2 ul{list-style:none;display:grid;gap:9px}
  .cols2 li{font-size:13.5px;padding-left:18px;position:relative}
  .cols2 li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

  .cta-sim{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:var(--ink);color:var(--white);
    border:none;border-radius:12px;padding:15px 22px;font-family:var(--sans);font-size:14.5px;font-weight:700;
    cursor:pointer;text-decoration:none}
  .cta-sim .arrow{font-family:var(--serif);font-weight:400}
  .cta-sim-sub{margin-top:10px;font-size:12px;color:var(--muted)}

  .contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;max-width:640px}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
  .contact-grid .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#8f979e}
  .contact-grid .v{font-size:15px;font-weight:700;margin-top:4px}
  .legal{margin-top:auto;padding-top:28px;font-size:10.5px;color:#8f979e;max-width:720px;line-height:1.6}

  .num-badge{position:absolute;bottom:22px;right:30px;font-size:11.5px;color:var(--muted);letter-spacing:.5px}
  .slide.cover .num-badge,.slide.contact .num-badge,.slide.stat .num-badge{color:#8f979e}

  #ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;z-index:50;pointer-events:none}
  #ctrl > *{pointer-events:auto}
  body.scroll-mode #ctrl{position:fixed}
  .ctrl-btn{background:rgba(22,26,30,.82);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:20px;
    padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);backdrop-filter:blur(6px)}
  .ctrl-btn:hover{background:rgba(22,26,30,.95)}
  #pageInd{color:#fff;font-size:12px;background:rgba(22,26,30,.82);border-radius:20px;padding:8px 14px;min-width:52px;text-align:center}

  @media print{
    body{overflow:visible !important;background:#fff}
    #ctrl,#civBanner{display:none !important}
    .slide{position:static !important;display:flex !important;height:100vh;page-break-after:always;overflow:visible}
    .slide:last-child{page-break-after:auto}
  }
  @media (max-width:640px){
    .slide{padding:56px 20px 90px}
    .contact-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="deck"></div>

<div id="ctrl">
  <button class="ctrl-btn" id="btnPrev" onclick="goTo(current-1)" title="Précédent (←)">‹ Précédent</button>
  <span id="pageInd">1 / 1</span>
  <button class="ctrl-btn" id="btnNext" onclick="goTo(current+1)" title="Suivant (→)">Suivant ›</button>
  <button class="ctrl-btn" onclick="toggleFullscreen()" title="Plein écran">⛶ Plein écran</button>
  <button class="ctrl-btn" onclick="window.print()" title="Imprimer / PDF">Imprimer</button>
</div>

<script>
(function(){
  var LOGO_SRC = /glrimmobilier\.com$/i.test(location.hostname) ? "/selection/logo-glr.png" : "logo-glr.png";

  var qs = new URLSearchParams(location.search);
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  var conseillerPrenom = (qs.get('cp') || '').trim();
  var conseillerNom = (qs.get('cn') || '').trim();
  var conseillerNomComplet = (conseillerPrenom + ' ' + conseillerNom).trim();
  var conseillerEmail = (qs.get('ce') || '').trim();
  var conseillerTel = (qs.get('ct') || '').trim();
  var civilite = (qs.get('civ') || '').trim();
  var clientNom = (qs.get('client') || '').trim();
  var clientLabel = (civilite && clientNom) ? (civilite + ' ' + clientNom) : '';

  var SUPABASE_URL = 'https://hydqfbxdtpmbuooexekp.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZHFmYnhkdHBtYnVvb2V4ZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODA3NDEsImV4cCI6MjA5NDg1Njc0MX0.ylton95WooAxVbIqdgYIaiW8E6lGlxEuKsLEe-hzU0g';

  function badgeConseiller(){
    return '<div class="pill">Conseiller' + (conseillerNomComplet ? '' : ' GLR Immobilier') + '</div>' +
      (conseillerNomComplet ? '<div class="conseiller-nom">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub">GLR Immobilier — Conseiller en immobilier neuf</div>' : '');
  }

  var slides = [];

  // 1. Couverture
  slides.push({ cls:'cover', html:
    '<div class="eyebrow">GLR IMMOBILIER</div>' +
    '<h1>Votre projet dans le neuf,<br>accompagné du premier échange<br>à la remise des clés</h1>' +
    '<div class="lead">' + (clientLabel ? 'Présentation préparée pour ' + esc(clientLabel) + '.' : 'Présentation à destination de nos clients.') + '</div>' +
    '<div style="margin-top:40px">' + badgeConseiller() + '</div>'
  });

  // 2. Sommaire
  var sommaire = [
    'Le même prix, un accompagnement en plus','Un accès à tout le marché, pas à un seul promoteur',
    '0€ d’honoraires pour vous','Les avantages du neuf','Ce que nous avons actuellement en stock',
    'Le financement de votre projet','Notre méthode, étape par étape','Les grandes étapes d’un achat dans le neuf',
    'Restons en contact'
  ];
  slides.push({ html:
    '<div class="eyebrow">SOMMAIRE</div><h2>Ce que nous allons voir ensemble</h2>' +
    '<div class="content"><ol class="steps">' +
    sommaire.map(function(t,i){ return '<li><div class="n">' + (i+1) + '</div><div><h3 style="font-weight:600;font-size:14.5px">' + esc(t) + '</h3></div></li>'; }).join('') +
    '</ol></div>'
  });

  // 3. Comparatif
  slides.push({ html:
    '<div class="eyebrow">POURQUOI GLR</div><h2>Le même prix, un accompagnement en plus</h2>' +
    '<div class="lead">Le prix d’un bien neuf est fixé par le promoteur — il est identique, que vous passiez par nous ou en direct.</div>' +
    '<div class="content"><table class="comparatif"><thead><tr><th></th><th>En direct avec le promoteur</th><th>Avec GLR</th></tr></thead><tbody>' +
    [['Prix du bien','Identique','Identique'],
     ['Choix de programmes','Un seul promoteur','L’ensemble du marché neuf'],
     ['Recherche après le 1ᵉʳ contact','Aucune','Veille automatique en continu'],
     ['Accompagnement','Standardisé','Un seul interlocuteur, sur mesure']]
    .map(function(r){ return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') +
    '</tbody></table></div>'
  });

  // 4. Indépendance
  slides.push({ html:
    '<div class="eyebrow">INDÉPENDANCE</div><h2>Un accès à tout le marché, pas à un seul promoteur</h2>' +
    '<div class="content grid g3">' +
    [['Indépendance','GLR n’est engagé avec aucun promoteur en particulier — le conseil porte sur ce qui vous correspond, jamais sur ce qu’il faut écouler.'],
     ['Étendue','Accès à l’ensemble des programmes commercialisés, tous promoteurs confondus, dans les secteurs que vous recherchez.'],
     ['Veille automatique','Dès qu’un lot correspond à vos critères, vous êtes alerté — la recherche continue après ce rendez-vous, pas seulement pendant.']]
    .map(function(c,i){ return '<div class="card"><div class="num">' + (i+1) + '</div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div>'; }).join('') +
    '</div>'
  });

  // 5. Honoraires
  slides.push({ html:
    '<div class="eyebrow">TRANSPARENCE</div><h2>0€ d’honoraires pour vous</h2>' +
    '<div class="content"><div class="zero">0€</div><div class="zero-label">à la charge du client</div>' +
    '<div class="lead" style="margin-top:20px">GLR est rémunéré par le promoteur, dans le cadre d’un mandat — exactement comme n’importe quel commercial qui vend un programme neuf.<br><br>Vous ne payez ni plus cher qu’en direct, ni de frais supplémentaires pour être accompagné.</div></div>'
  });

  // 6. Avantages du neuf
  slides.push({ html:
    '<div class="eyebrow">VEFA</div><h2>Les avantages du neuf</h2>' +
    '<div class="content grid g4">' +
    [['Garanties constructeur','Parfait achèvement, biennale, décennale — un logement couvert dès la livraison.'],
     ['Frais de notaire réduits','Environ 2 à 3 % dans le neuf, contre 7 à 8 % dans l’ancien.'],
     ['Personnalisation','Cloisons, finitions et équipements choisis avant la livraison.'],
     ['Performance énergétique','Normes actuelles (RE2020) : charges réduites et meilleur confort thermique.']]
    .map(function(c,i){ return '<div class="card"><div class="num">' + (i+1) + '</div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div>'; }).join('') +
    '</div>'
  });

  // 7. Catalogue — connecté en direct à la carte des programmes
  slides.push({ cls:'stat', html:
    '<div class="eyebrow">NOTRE CATALOGUE</div><h2 style="color:#fff">Ce que nous avons actuellement en stock</h2>' +
    '<div class="lead" style="color:#cfe3e9">Programmes avec des lots disponibles, Île-de-France — données CRM en temps réel</div>' +
    '<div class="content"><div class="stat-num" id="statAvecLots">…</div>' +
    '<div class="stat-label">programmes avec des lots disponibles aujourd’hui</div>' +
    '<div class="stat-sub">Sur <b id="statTotal">…</b> programmes suivis en continu, en lien avec <b id="statPromoteurs">…</b> promoteurs partenaires en Île-de-France.</div>' +
    '<div class="stat-note">En pratique : une sélection personnalisée vous est envoyée après cet échange, puis actualisée dès qu’un nouveau lot correspond.</div></div>'
  });

  // 8. Financement
  slides.push({ html:
    '<div class="eyebrow">FINANCEMENT</div><h2>Le financement de votre projet</h2>' +
    '<div class="content cols2">' +
    '<div><h3>Les dispositifs mobilisables</h3><ul>' +
    ['Prêt à Taux Zéro (PTZ)','Prêt Action Logement (ex-1 % patronal)','Prêt Paris Logement à 0 % (selon zone)','TVA réduite à 5,5 % (selon secteur et dispositif)']
    .map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
    '<div><h3>Comment GLR vous accompagne</h3><ul>' +
    ['Une première estimation de votre capacité, selon votre projet et votre zone','Un chiffrage détaillé une fois votre sélection de biens établie','Un partenaire courtier pour l’accord de principe bancaire']
    .map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
    '</div>' +
    '<div><a class="cta-sim" href="simulateur.html" target="_blank" rel="noopener">Faire la simulation maintenant <span class="arrow">→</span></a>' +
    '<div class="cta-sim-sub">On calcule ensemble votre capacité d’emprunt, avec les aides mobilisables.</div></div>'
  });

  // 9. Méthode
  slides.push({ html:
    '<div class="eyebrow">NOTRE MÉTHODE</div><h2>Notre méthode, étape par étape</h2>' +
    '<div class="content"><ol class="steps">' +
    [['Écoute','On comprend votre projet et vos critères — ville, budget, typologie, calendrier.'],
     ['Sélection','Une sélection personnalisée, construite sur l’ensemble du marché disponible.'],
     ['Visite & financement','Visite des biens retenus et simulation chiffrée de votre financement.'],
     ['Réservation','Montage du dossier et signature du contrat de réservation.'],
     ['Suivi','Accompagnement jusqu’à la remise des clés, et au-delà.']]
    .map(function(c,i){ return '<li><div class="n">' + (i+1) + '</div><div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div></li>'; }).join('') +
    '</ol></div>'
  });

  // 10. Étapes VEFA
  slides.push({ html:
    '<div class="eyebrow">VEFA</div><h2>Les grandes étapes d’un achat dans le neuf</h2>' +
    '<div class="content"><ol class="steps">' +
    [['Réservation','Signature du contrat de réservation préliminaire.'],
     ['Acte authentique','Offre de prêt puis signature chez le notaire — 1ᵉʳ appel de fonds.'],
     ['Construction','Appels de fonds selon l’avancement : fondations, hors d’eau, hors d’air, achèvement.'],
     ['Livraison','Remise des clés et vérifications contradictoires.'],
     ['Garanties','Parfait achèvement, biennale et décennale prennent le relais.']]
    .map(function(c,i){ return '<li><div class="n">' + (i+1) + '</div><div><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div></li>'; }).join('') +
    '</ol></div>'
  });

  // 11. Contact
  slides.push({ cls:'contact', html:
    '<div class="eyebrow">GLR IMMOBILIER</div><h1>Restons en contact</h1>' +
    (conseillerNomComplet ? '<div class="conseiller-nom" style="margin-top:18px;font-size:22px">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub">Conseiller en immobilier neuf — GLR Immobilier</div>' : '') +
    '<div class="contact-grid">' +
    (conseillerTel ? '<div><div class="k">Téléphone</div><div class="v">' + esc(conseillerTel) + '</div></div>' : '') +
    (conseillerEmail ? '<div><div class="k">E-mail</div><div class="v">' + esc(conseillerEmail) + '</div></div>' : '') +
    '<div><div class="k">Site</div><div class="v">www.glrimmobilier.com</div></div>' +
    '</div>' +
    '<div class="lead" style="margin-top:30px">Merci pour votre confiance.</div>' +
    '<div class="legal">GLR Immobilier — Carte professionnelle CPI 7501 2025 000 000 211 (CCI Paris Île-de-France) — RC Pro Allianz n° 64194122 — RCS Paris 933 789 612</div>'
  });

  var deck = document.getElementById('deck');
  slides.forEach(function(s, i){
    var div = document.createElement('div');
    div.className = 'slide' + (s.cls ? ' ' + s.cls : '');
    div.innerHTML = '<img class="logo" alt="GLR Immobilier" style="height:26px;width:auto;position:absolute;top:26px;left:min(9vw,90px)" onerror="this.style.display=\'none\'" src="' + LOGO_SRC + '">' +
      s.html + '<div class="num-badge">' + String(i+1).padStart(2,'0') + ' / ' + slides.length + '</div>';
    deck.appendChild(div);
  });

  var current = 0;
  window.current = 0;
  function goTo(i){
    if (i < 0 || i >= slides.length) return;
    var nodes = deck.querySelectorAll('.slide');
    nodes[current].classList.remove('active');
    current = i; window.current = i;
    nodes[current].classList.add('active');
    document.getElementById('pageInd').textContent = (current+1) + ' / ' + slides.length;
    document.getElementById('btnPrev').style.visibility = current === 0 ? 'hidden' : 'visible';
    document.getElementById('btnNext').style.visibility = current === slides.length-1 ? 'hidden' : 'visible';
  }
  window.goTo = goTo;
  goTo(0);

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { goTo(current+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goTo(current-1); e.preventDefault(); }
    else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });
  deck.addEventListener('click', function(e){
    if (e.target.closest('.ctrl-btn') || document.body.classList.contains('scroll-mode')) return;
    var r = deck.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.65) goTo(current+1);
    else if (e.clientX - r.left < r.width * 0.35) goTo(current-1);
  });

  window.toggleFullscreen = function(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  };

  // En impression, tout doit être visible en même temps (page par page)
  window.addEventListener('beforeprint', function(){ document.body.classList.add('scroll-mode'); });
  window.addEventListener('afterprint', function(){ document.body.classList.remove('scroll-mode'); goTo(current); });

  // Chiffres du catalogue en direct depuis la pige (fonction plaquette_stats, lecture anonyme)
  var statsCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  if (statsCtrl) setTimeout(function(){ statsCtrl.abort(); }, 6000);
  fetch(SUPABASE_URL + '/rest/v1/rpc/plaquette_stats', {
    method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}',
    signal: statsCtrl ? statsCtrl.signal : undefined
  }).then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
    if (!s) throw new Error('vide');
    var fr = function(n){ return Number(n).toLocaleString('fr-FR'); };
    document.getElementById('statAvecLots').textContent = fr(s.avec_lots);
    document.getElementById('statTotal').textContent = fr(s.total);
    document.getElementById('statPromoteurs').textContent = fr(s.promoteurs);
  }).catch(function(){
    ['statAvecLots','statTotal','statPromoteurs'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.textContent = '—';
    });
  });
})();
</script>
</body></html>
