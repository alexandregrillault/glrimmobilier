<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Présentation — GLR Immobilier</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --ink:#161A1E; --teal:#005875; --muted:#616B75; --gold:#8A6A2F; --gold-light:#C6A063;
    --cream:#F3EFE6; --cream2:#EAE6DD; --white:#FFFFFF; --line:#DCD6C6;
    --serif:Cambria,Georgia,'Times New Roman',serif;
    --sans:Calibri,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow:hidden}
  body.scroll-mode{overflow:auto;background:var(--cream)}

  #progress{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:60;transition:width .45s cubic-bezier(.65,0,.35,1)}

  #deck{position:relative;width:100%;height:100vh;background:var(--cream);overflow:hidden}
  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;
    background:var(--cream);padding:min(8vh,64px) min(8vw,84px) min(8vh,54px);overflow-y:auto;
    transform:translateX(100%);opacity:0;transition:transform .5s cubic-bezier(.65,0,.35,1),opacity .4s ease;
  }
  .slide.prev{transform:translateX(-100%);opacity:0}
  .slide.active{transform:translateX(0);opacity:1;z-index:2}
  body.scroll-mode .slide{position:static;transform:none !important;opacity:1 !important;display:flex !important;min-height:100vh;border-bottom:1px solid var(--line)}

  .slide .reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
  .slide.active .reveal{opacity:1;transform:translateY(0)}
  .slide.active .reveal:nth-child(1){transition-delay:.05s}
  .slide.active .reveal:nth-child(2){transition-delay:.12s}
  .slide.active .reveal:nth-child(3){transition-delay:.19s}
  .slide.active .reveal:nth-child(4){transition-delay:.26s}
  .slide.active .reveal:nth-child(5){transition-delay:.33s}
  .slide.active .reveal:nth-child(6){transition-delay:.40s}

  .bg-num{position:absolute;right:min(3vw,46px);bottom:min(2vh,20px);font-family:var(--serif);font-weight:700;
    font-size:clamp(140px,20vw,260px);color:var(--ink);opacity:.035;line-height:1;pointer-events:none;z-index:-1;user-select:none}

  .eyebrow{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:'';width:22px;height:2px;background:var(--gold-light)}
  h1{font-family:var(--serif);font-size:clamp(28px,4vw,46px);font-weight:700;margin-top:14px;line-height:1.16;color:var(--ink)}
  h2{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:700;margin-top:10px;line-height:1.2;color:var(--ink)}
  .lead{font-size:clamp(14px,1.4vw,16.5px);color:var(--muted);margin-top:12px;max-width:680px;line-height:1.6}
  .content{margin-top:clamp(20px,3vh,30px);max-width:1040px;width:100%}

  .pour{font-family:var(--serif);font-size:clamp(19px,2.4vw,26px);color:var(--teal);font-weight:700;margin-top:6px}
  .date-badge{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:14px;letter-spacing:.3px}

  .conseiller-block{margin-top:auto;padding-top:22px;display:flex;align-items:center;gap:14px}
  .conseiller-av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;flex:none}
  .conseiller-nom{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
  .conseiller-sub{font-size:11.5px;color:var(--muted)}

  /* Colonne de couverture / contact à deux volets */
  .split{flex:1;display:grid;grid-template-columns:1.25fr .95fr;gap:min(6vw,56px);align-items:stretch;width:100%;margin-top:8px}
  @media (max-width:900px){.split{grid-template-columns:1fr;gap:26px}}
  .split-left{display:flex;flex-direction:column;height:100%}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(26px,3vw,38px);
    display:flex;flex-direction:column;gap:22px;box-shadow:0 2px 12px rgba(22,26,30,.06);position:relative;overflow:hidden;
    align-self:center;justify-self:stretch}
  .panel::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(138,106,47,.07)}
  .panel .eyebrow{color:var(--teal)}
  .panel .eyebrow::before{background:var(--teal)}
  .panel-stat{font-family:var(--serif);font-weight:700;font-size:clamp(46px,6vw,66px);color:var(--teal);line-height:1}
  .panel-stat-label{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .panel-tag{font-size:13px;color:var(--ink);line-height:1.6;font-family:var(--serif);font-style:italic;padding-top:18px;border-top:1px solid var(--line)}

  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
  table.comparatif{width:100%;min-width:520px;border-collapse:collapse;margin-top:4px;background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(22,26,30,.08)}
  table.comparatif th,table.comparatif td{padding:12px 18px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  table.comparatif thead th{font-family:var(--serif);font-size:12.5px;background:var(--ink);color:var(--white);font-weight:700}
  table.comparatif thead th:first-child{color:#aab0b6;font-weight:400}
  table.comparatif tbody th{color:var(--muted);font-weight:600;white-space:nowrap}
  table.comparatif tbody td:nth-child(3){color:var(--teal);font-weight:700}
  table.comparatif tr:last-child td,table.comparatif tr:last-child th{border-bottom:none}

  .grid{display:grid;gap:13px}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  @media (max-width:820px){.grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:17px 19px;box-shadow:0 1px 3px rgba(22,26,30,.05)}
  .card .icowrap{width:32px;height:32px;border-radius:9px;background:rgba(0,88,117,.08);display:flex;align-items:center;justify-content:center;color:var(--teal)}
  .card h3{font-family:var(--serif);font-size:15px;font-weight:700;margin-top:11px;color:var(--ink)}
  .card p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}
  .card.compact{padding:14px 16px}
  .card.compact .icowrap{width:26px;height:26px}
  .card.compact h3{font-size:13.5px;margin-top:9px}
  .card.compact p{font-size:11.5px;margin-top:5px}

  .zero-wrap{display:flex;align-items:baseline;gap:16px}
  .zero{font-family:var(--serif);font-weight:700;font-size:clamp(64px,9vw,110px);color:var(--teal);line-height:1}
  .zero-label{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

  ol.steps{list-style:none;margin-top:2px;display:grid;gap:12px}
  ol.steps li{display:flex;gap:14px;align-items:flex-start}
  ol.steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--white);border:1.5px solid var(--gold-light);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:12.5px}
  ol.steps h3{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--ink)}
  ol.steps p{font-size:12px;color:var(--muted);margin-top:2px}
  ol.steps.compact{gap:11px}
  ol.steps.compact .n{width:25px;height:25px;font-size:11px;border-width:1.3px}
  ol.steps.compact h3{font-size:13px}
  ol.steps.compact p{font-size:11px;line-height:1.4}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:4px;align-items:start}
  @media (max-width:820px){.cols2{grid-template-columns:1fr}}
  .cols2 h3{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--teal);margin-bottom:11px}
  .icon-rows{list-style:none;display:grid;gap:16px}
  .icon-rows li{display:flex;gap:13px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .icon-rows li .icowrap{flex:none;width:30px;height:30px;margin-top:1px}

  /* Frise horizontale (parcours) */
  .frise-section{margin-top:26px}
  .frise-section:first-child{margin-top:0}
  .frise-section h3{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--teal);margin-bottom:18px}
  .frise{display:flex;align-items:flex-start;position:relative}
  .frise::before{content:'';position:absolute;top:15px;left:15px;right:15px;height:1.5px;background:var(--line);z-index:0}
  .frise-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 8px;z-index:1}
  .frise-step .n{width:30px;height:30px;border-radius:50%;background:var(--white);border:1.5px solid var(--gold-light);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:12.5px;flex:none}
  .frise-step h4{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);margin-top:11px}
  .frise-step p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
  @media (max-width:900px){
    .frise{flex-direction:column;gap:16px}
    .frise::before{display:none}
    .frise-step{flex-direction:row;text-align:left;align-items:flex-start;gap:12px;padding:0}
    .frise-step h4,.frise-step p{margin-top:0}
  }

  /* Contact — bloc centré */
  .contact-center{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;margin-top:6px}
  .contact-nom{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);font-weight:700;color:var(--ink)}
  .contact-tel{font-family:var(--serif);font-size:clamp(42px,6.4vw,66px);font-weight:700;color:var(--teal);margin-top:24px;letter-spacing:.5px}
  .contact-sub-row{margin-top:16px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .contact-sub-row .dot{color:var(--gold-light)}

  .slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}

  .cta-banner{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:26px 30px;
    display:flex;align-items:center;justify-content:space-between;gap:22px;margin-top:28px;box-shadow:0 1px 4px rgba(22,26,30,.06);flex-wrap:wrap}
  .cta-banner h3{font-family:var(--serif);font-size:18.5px;font-weight:700;color:var(--ink)}
  .cta-sim{display:inline-flex;align-items:center;gap:10px;flex:none;background:var(--ink);color:var(--white);
    border:none;border-radius:12px;padding:14px 22px;font-family:var(--sans);font-size:14px;font-weight:700;
    cursor:pointer;text-decoration:none;transition:transform .15s ease}
  .cta-sim:hover{transform:translateY(-1px)}
  .cta-sim .arrow{font-family:var(--serif);font-weight:400}
  .cta-sim-sub{margin-top:6px;font-size:11.5px;color:var(--muted);max-width:420px}

  /* Diapo carte */
  .map-wrap{position:relative;width:100%;height:min(58vh,520px);border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 10px rgba(22,26,30,.1);background:var(--white)}
  .map-wrap iframe{width:100%;height:100%;border:0;display:block}
  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .stat-chip{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:baseline;gap:7px}
  .stat-chip b{font-family:var(--serif);font-size:19px;color:var(--teal)}
  .stat-chip span{font-size:11.5px;color:var(--muted)}
  .stat-col{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%}
  .stat-col .stat-chip{justify-content:space-between;padding:15px 19px}
  .stat-col .stat-chip b{font-size:25px}
  .map-villes{font-size:12px;color:var(--muted);margin-top:8px}
  .map-villes b{color:var(--ink)}

  .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:24px;max-width:420px}
  .contact-grid .k{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .contact-grid .v{font-size:15px;font-weight:700;margin-top:4px;color:var(--ink)}
  .legal{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);max-width:560px;line-height:1.6}

  .num-badge{position:absolute;bottom:18px;right:min(8vw,84px);font-size:11px;color:var(--muted);letter-spacing:.5px}
  .logo-mark{position:absolute;top:24px;left:min(8vw,84px);height:23px;width:auto}
  .client-badge{position:absolute;top:22px;right:min(8vw,84px);text-align:right;line-height:1.3}
  .client-badge .k{display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
  .client-badge .v{display:block;font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--gold);margin-top:1px}
  @media (max-width:640px){.client-badge{display:none}}

  #ctrl{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;z-index:50;pointer-events:none}
  #ctrl > *{pointer-events:auto}
  body.scroll-mode #ctrl{position:fixed}
  .ctrl-btn{background:rgba(22,26,30,.86);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:20px;
    padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);backdrop-filter:blur(6px)}
  .ctrl-btn:hover{background:rgba(22,26,30,.98)}
  #pageInd{color:#fff;font-size:12px;background:rgba(22,26,30,.86);border-radius:20px;padding:9px 14px;min-width:52px;text-align:center}

  @media print{
    body{overflow:visible !important;background:#fff}
    #ctrl,#progress{display:none !important}
    .slide{position:static !important;transform:none !important;opacity:1 !important;display:flex !important;height:100vh;page-break-after:always;overflow:visible}
    .slide:last-child{page-break-after:auto}
    .slide .reveal{opacity:1 !important;transform:none !important}
  }
  @media (max-width:640px){
    .slide{padding:56px 18px 88px}
    .contact-grid{grid-template-columns:1fr}
    .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
    .cta-banner{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>

<div id="ctrl">
  <button class="ctrl-btn" id="btnPrev" onclick="goTo(current-1)" title="Précédent (←)">‹ Précédent</button>
  <span id="pageInd">1 / 1</span>
  <button class="ctrl-btn" id="btnNext" onclick="goTo(current+1)" title="Suivant (→)">Suivant ›</button>
  <button class="ctrl-btn" onclick="toggleFullscreen()" title="Plein écran">⛶ Plein écran</button>
  <button class="ctrl-btn" onclick="window.print()" title="Imprimer / PDF">Imprimer</button>
</div>

<script>
(function(){
  var LOGO_SRC = /glrimmobilier\.com$/i.test(location.hostname) ? "/selection/logo-glr.png" : "logo-glr.png";

  var qs = new URLSearchParams(location.search);
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  var conseillerPrenom = (qs.get('cp') || '').trim();
  var conseillerNom = (qs.get('cn') || '').trim();
  var conseillerNomComplet = (conseillerPrenom + ' ' + conseillerNom).trim();
  var conseillerEmail = (qs.get('ce') || '').trim();
  var conseillerTel = (qs.get('ct') || '').trim();
  var civilite = (qs.get('civ') || '').trim();
  var clientNom = (qs.get('client') || '').trim();
  var clientLabel = (civilite && clientNom) ? (civilite + ' ' + clientNom) : '';
  var villesClient = (qs.get('villes') || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  // Client identifié (22/09) : permet au bouton "Lancer la simulation" d'ouvrir le
  // simulateur avec les vrais lots de sa sélection, et d'enregistrer sur sa fiche.
  var contactId = (qs.get('contact') || '').trim();
  var simulateurLien = 'simulateur.html' + (contactId ? ('?embed=1&contact=' + encodeURIComponent(contactId)) : '');

  var SUPABASE_URL = 'https://hydqfbxdtpmbuooexekp.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5ZHFmYnhkdHBtYnVvb2V4ZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODA3NDEsImV4cCI6MjA5NDg1Njc0MX0.ylton95WooAxVbIqdgYIaiW8E6lGlxEuKsLEe-hzU0g';

  var dateAuj = new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  function initiales(){
    var a = (conseillerPrenom||'').charAt(0), b = (conseillerNom||'').charAt(0);
    return (a+b).toUpperCase() || 'GLR';
  }
  function conseillerBlock(){
    if (!conseillerNomComplet) return '';
    return '<div class="conseiller-block reveal"><div class="conseiller-av">' + esc(initiales()) + '</div>' +
      '<div><div class="conseiller-nom">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub">Conseiller en immobilier neuf — GLR Immobilier</div></div></div>';
  }
  function bgNum(i){ return '<div class="bg-num">' + String(i+1).padStart(2,'0') + '</div>'; }
  // Rappel discret du destinataire en haut de chaque diapo, pour que la personnalisation
  // se sente tout du long et pas seulement sur la couverture.
  var clientBadgeHtml = clientLabel ? '<div class="client-badge"><span class="k">Présentation pour</span><span class="v">' + esc(clientLabel) + '</span></div>' : '';

  var ICONS = {
    independance:'<path d="M12 2 3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z"/>',
    etendue:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/>',
    veille:'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3.2"/>',
    garantie:'<path d="M12 2 4 5v6c0 5.2 3.4 8.6 8 9.6 4.6-1 8-4.4 8-9.6V5l-8-3z"/><path d="M9 12l2 2 4-4"/>',
    notaire:'<path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-6h6v6"/>',
    perso:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',
    energie:'<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>',
    pret:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M9 9.8c0-1.2 1.2-2.1 3-2.1s3 .8 3 1.9-1.2 1.6-3 1.8-3 .8-3 1.9 1.2 1.9 3 1.9 3-.9 3-2.1"/>',
    accompagnement:'<path d="M20 15a2 2 0 0 1-2 2H9l-4 4V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v9z"/>'
  };
  function icon(name){ return '<svg class="icowrap" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name]||'') + '</svg>'; }

  var slides = [];

  // 1. Couverture — nom du client en avant, à droite un aperçu vivant du catalogue
  slides.push({ html:
    '<div class="split">' +
      '<div class="split-left">' +
        '<div class="eyebrow reveal">GLR IMMOBILIER</div>' +
        '<h1 class="reveal">Votre projet dans le neuf,<br>accompagné du premier échange<br>à la remise des clés</h1>' +
        (clientLabel ? '<div class="pour reveal">Pour ' + esc(clientLabel) + '</div>' : '') +
        '<div class="date-badge reveal">' + esc(dateAuj) + '</div>' +
        conseillerBlock() +
      '</div>' +
      '<div class="panel reveal">' +
        '<div class="eyebrow">EN DIRECT DE NOTRE CATALOGUE</div>' +
        '<div><div class="panel-stat js-avec-lots">…</div><div class="panel-stat-label">programmes avec lots disponibles<br>actuellement, partout en Île-de-France</div></div>' +
        '<div class="panel-tag">« Un accès à tout le marché du neuf,<br>pas à un seul promoteur. »</div>' +
      '</div>' +
    '</div>'
  });

  // 2. Pourquoi GLR — comparatif + ce que ça change concrètement, sur une même diapo
  slides.push({ html:
    '<div class="eyebrow reveal">POURQUOI GLR</div><h2 class="reveal">Le même prix, un accompagnement en plus</h2>' +
    '<div class="lead reveal">Le prix d’un bien neuf est fixé par le promoteur — identique, que vous passiez par nous ou en direct. Ce qui change, c’est l’indépendance et le suivi.</div>' +
    '<div class="content reveal">' +
    '<div class="table-scroll"><table class="comparatif"><thead><tr><th></th><th>En direct avec le promoteur</th><th>Avec GLR</th></tr></thead><tbody>' +
    [['Prix du bien','Identique','Identique'],
     ['Choix de programmes','Un seul promoteur','L’ensemble du marché neuf'],
     ['Recherche après le 1ᵉʳ contact','Aucune','Veille automatique en continu'],
     ['Accompagnement','Standardisé','Un seul interlocuteur, sur mesure']]
    .map(function(r){ return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
    '<div class="grid g3" style="margin-top:24px;gap:16px">' +
    [['independance','Indépendance','Aucun engagement avec un promoteur en particulier — le conseil porte sur ce qui vous correspond.'],
     ['etendue','Étendue','Accès à l’ensemble des programmes commercialisés, tous promoteurs confondus, dans vos secteurs.'],
     ['veille','Veille automatique','Dès qu’un lot correspond à vos critères, vous êtes alerté — la recherche continue après ce rendez-vous.']]
    .map(function(c){ return '<div class="card">' + icon(c[0]) + '<h3>' + esc(c[1]) + '</h3><p>' + esc(c[2]) + '</p></div>'; }).join('') +
    '</div></div>'
  });

  // 3. Ce qui change pour vous — honoraires + avantages du neuf, en deux colonnes
  slides.push({ html:
    '<div class="eyebrow reveal">CE QUI CHANGE POUR VOUS</div><h2 class="reveal">Transparence, garanties, fiscalité</h2>' +
    '<div class="content reveal cols2">' +
    '<div><div class="zero-wrap"><div class="zero">0€</div><div class="zero-label">à la charge<br>du client</div></div>' +
    '<div class="lead" style="margin-top:20px;max-width:100%">GLR est rémunéré par le promoteur, dans le cadre d’un mandat — comme n’importe quel commercial qui vend un programme neuf. Vous ne payez ni plus cher qu’en direct, ni de frais supplémentaires pour être accompagné.</div></div>' +
    '<div><h3>Les avantages du neuf</h3><div class="grid g2" style="gap:16px">' +
    [['garantie','Garanties constructeur','Parfait achèvement, biennale, décennale.'],
     ['notaire','Frais de notaire réduits','2 à 3 % dans le neuf, contre 7 à 8 % dans l’ancien.'],
     ['perso','Personnalisation','Cloisons, finitions et équipements choisis avant livraison.'],
     ['energie','Performance énergétique','Normes RE2020 : charges réduites, meilleur confort.']]
    .map(function(c){ return '<div class="card">' + icon(c[0]) + '<h3>' + esc(c[1]) + '</h3><p>' + esc(c[2]) + '</p></div>'; }).join('') +
    '</div></div>' +
    '</div>'
  });

  // 4. Catalogue connecté à la carte en direct — la vraie carte, filtrée sur les
  // villes recherchées par le client quand on les connaît, sinon vue IDF complète.
  (function(){
    var criteres = villesClient.length ? JSON.stringify({ villes: villesClient }) : '';
    var mapSrc = 'carte.html' + (criteres ? '?criteres=' + encodeURIComponent(criteres) : '');
    slides.push({ html:
      '<div class="eyebrow reveal">NOTRE CATALOGUE</div><h2 class="reveal">Ce que nous avons actuellement en stock</h2>' +
      '<div class="lead reveal">Carte des programmes GLR, Île-de-France — données en temps réel' + (villesClient.length ? ', filtrée sur vos secteurs de recherche' : '') + '.</div>' +
      '<div class="content reveal" style="display:flex;gap:22px;align-items:stretch;flex-wrap:wrap;max-width:100%">' +
      '<div style="flex:1 1 72%;min-width:340px">' +
      '<div class="map-wrap"><iframe src="' + esc(mapSrc) + '" loading="lazy" title="Carte des programmes GLR"></iframe></div>' +
      (villesClient.length ? '<div class="map-villes">Filtré sur : <b>' + esc(villesClient.join(', ')) + '</b></div>' : '') +
      '</div>' +
      '<div style="flex:0 0 220px;min-width:190px" class="stat-col">' +
      '<div class="stat-chip"><b class="js-avec-lots">…</b><span>avec lots disponibles</span></div>' +
      '<div class="stat-chip"><b class="js-total">…</b><span>programmes suivis</span></div>' +
      '<div class="stat-chip"><b class="js-promoteurs">…</b><span>promoteurs partenaires</span></div>' +
      '</div></div>'
    });
  })();

  // 5. Financement
  slides.push({ html:
    '<div class="eyebrow reveal">FINANCEMENT</div><h2 class="reveal">Le financement de votre projet</h2>' +
    '<div class="lead reveal">Deux volets à préparer ensemble : les dispositifs auxquels vous avez droit, et le chiffrage précis de votre capacité.</div>' +
    '<div class="content reveal cols2">' +
    '<div><h3>Les dispositifs mobilisables</h3><ul class="icon-rows">' +
    ['Prêt à Taux Zéro (PTZ)','Prêt Action Logement (ex-1 % patronal)','Prêt Paris Logement à 0 % (selon zone)','TVA réduite à 5,5 % (selon secteur et dispositif)']
    .map(function(t){ return '<li>' + icon('pret') + '<span>' + esc(t) + '</span></li>'; }).join('') + '</ul></div>' +
    '<div><h3>Comment GLR vous accompagne</h3><ul class="icon-rows">' +
    ['Une première estimation de votre capacité, selon votre projet et votre zone','Un chiffrage détaillé une fois votre sélection de biens établie','Un partenaire courtier pour l’accord de principe bancaire']
    .map(function(t){ return '<li>' + icon('accompagnement') + '<span>' + esc(t) + '</span></li>'; }).join('') + '</ul></div>' +
    '</div>' +
    '<div class="cta-banner reveal"><div><h3>Faisons le calcul ensemble</h3>' +
    '<div class="cta-sim-sub">On simule votre capacité d’emprunt, avec les aides mobilisables, en direct avec vous.</div></div>' +
    '<a class="cta-sim" href="' + esc(simulateurLien) + '" target="_blank" rel="noopener">Lancer la simulation <span class="arrow">→</span></a></div>'
  });

  // 6. Notre parcours — méthode GLR + grandes étapes VEFA, en frises horizontales
  slides.push({ html:
    '<div class="eyebrow reveal">DE LA RECHERCHE À LA LIVRAISON</div><h2 class="reveal">Notre parcours, à vos côtés</h2>' +
    '<div class="content reveal" style="max-width:100%">' +
    '<div class="frise-section"><h3>Notre méthode</h3><div class="frise">' +
    [['Écoute','On comprend votre projet — ville, budget, typologie, calendrier.'],
     ['Sélection','Une sélection personnalisée, sur l’ensemble du marché disponible.'],
     ['Visite & financement','Visite des biens retenus et simulation de financement.'],
     ['Réservation','Montage du dossier et contrat de réservation.'],
     ['Suivi','Accompagnement jusqu’à la remise des clés, et au-delà.']]
    .map(function(c,i){ return '<div class="frise-step"><div class="n">' + (i+1) + '</div><h4>' + esc(c[0]) + '</h4><p>' + esc(c[1]) + '</p></div>'; }).join('') +
    '</div></div>' +
    '<div class="frise-section"><h3>Les grandes étapes VEFA</h3><div class="frise">' +
    [['Réservation','Signature du contrat de réservation préliminaire.'],
     ['Acte authentique','Offre de prêt puis signature chez le notaire.'],
     ['Construction','Appels de fonds selon l’avancement des travaux.'],
     ['Livraison','Remise des clés et vérifications contradictoires.'],
     ['Garanties','Parfait achèvement, biennale et décennale.']]
    .map(function(c,i){ return '<div class="frise-step"><div class="n">' + (i+1) + '</div><h4>' + esc(c[0]) + '</h4><p>' + esc(c[1]) + '</p></div>'; }).join('') +
    '</div></div>' +
    '</div>'
  });

  // 7. Contact — les coordonnées du conseiller, en grand et centrées
  slides.push({ html:
    '<div class="eyebrow reveal" style="justify-content:center">GLR IMMOBILIER</div><h1 class="reveal" style="text-align:center">Restons en contact</h1>' +
    '<div class="contact-center reveal">' +
      (conseillerNomComplet ? '<div class="contact-nom">' + esc(conseillerNomComplet) + '</div><div class="conseiller-sub" style="margin-top:5px">Conseiller en immobilier neuf — GLR Immobilier</div>' : '') +
      (conseillerTel ? '<div class="contact-tel">' + esc(conseillerTel) + '</div>' : '') +
      '<div class="contact-sub-row">' +
      (conseillerEmail ? '<span>' + esc(conseillerEmail) + '</span><span class="dot">•</span>' : '') +
      '<span>www.glrimmobilier.com</span>' +
      '</div>' +
    '</div>' +
    '<div class="legal reveal" style="text-align:center;margin:30px auto 0;max-width:640px">GLR Immobilier — Carte professionnelle CPI 7501 2025 000 000 211 (CCI Paris Île-de-France) — RC Pro Allianz n° 64194122 — RCS Paris 933 789 612</div>'
  });

  var deck = document.getElementById('deck');
  slides.forEach(function(s, i){
    var div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = bgNum(i) + '<img class="logo-mark" alt="GLR Immobilier" onerror="this.style.display=\'none\'" src="' + LOGO_SRC + '">' + (i === 0 ? '' : clientBadgeHtml) +
      '<div class="slide-body">' + s.html + '</div>' +
      '<div class="num-badge">' + String(i+1).padStart(2,'0') + ' / ' + slides.length + '</div>';
    deck.appendChild(div);
  });

  var current = 0;
  window.current = 0;
  var nodes = deck.querySelectorAll('.slide');
  function goTo(i){
    if (i < 0 || i >= slides.length || i === current) return;
    var dir = i > current ? 1 : -1;
    nodes[current].classList.remove('active');
    nodes[current].classList.add(dir > 0 ? 'prev' : 'next');
    nodes[i].classList.remove('prev');
    // force reflow so the entering slide starts from the right side before animating in
    void nodes[i].offsetWidth;
    nodes[i].classList.add('active');
    current = i; window.current = i;
    document.getElementById('progress').style.width = (((current+1)/slides.length)*100) + '%';
    document.getElementById('pageInd').textContent = (current+1) + ' / ' + slides.length;
    document.getElementById('btnPrev').style.visibility = current === 0 ? 'hidden' : 'visible';
    document.getElementById('btnNext').style.visibility = current === slides.length-1 ? 'hidden' : 'visible';
    setTimeout(function(){ [...nodes].forEach(function(n,k){ if (k!==current) n.classList.remove('prev'); }); }, 550);
  }
  window.goTo = goTo;
  nodes[0].classList.add('active');
  document.getElementById('progress').style.width = (100/slides.length) + '%';
  document.getElementById('pageInd').textContent = '1 / ' + slides.length;
  document.getElementById('btnPrev').style.visibility = 'hidden';

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { goTo(current+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goTo(current-1); e.preventDefault(); }
    else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });
  deck.addEventListener('click', function(e){
    if (e.target.closest('.ctrl-btn, .cta-sim, .map-wrap, a, button, iframe') || document.body.classList.contains('scroll-mode')) return;
    var r = deck.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.7) goTo(current+1);
    else if (e.clientX - r.left < r.width * 0.3) goTo(current-1);
  });

  window.toggleFullscreen = function(){
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  };

  window.addEventListener('beforeprint', function(){ document.body.classList.add('scroll-mode'); });
  window.addEventListener('afterprint', function(){ document.body.classList.remove('scroll-mode'); });

  // Chiffres du catalogue en direct depuis la pige (fonction plaquette_stats, lecture anonyme)
  // — utilisés à la fois sur la couverture, la diapo carte et la diapo contact.
  var statsCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  if (statsCtrl) setTimeout(function(){ statsCtrl.abort(); }, 6000);
  function compteA(el, to){
    var from = 0, dur = 900, t0 = null;
    function step(t){ if (!t0) t0 = t; var p = Math.min(1, (t - t0) / dur); var v = Math.round(from + (to - from) * (1 - Math.pow(1-p, 3)));
      el.textContent = v.toLocaleString('fr-FR'); if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  function compteAll(cls, to){ document.querySelectorAll('.' + cls).forEach(function(el){ compteA(el, to); }); }
  fetch(SUPABASE_URL + '/rest/v1/rpc/plaquette_stats', {
    method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}',
    signal: statsCtrl ? statsCtrl.signal : undefined
  }).then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
    if (!s) throw new Error('vide');
    compteAll('js-avec-lots', s.avec_lots);
    compteAll('js-total', s.total);
    compteAll('js-promoteurs', s.promoteurs);
  }).catch(function(){
    ['js-avec-lots','js-total','js-promoteurs'].forEach(function(cls){
      document.querySelectorAll('.' + cls).forEach(function(el){ el.textContent = '—'; });
    });
  });
})();
</script>
</body></html>
