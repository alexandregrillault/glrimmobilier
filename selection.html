<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votre sélection — GLR Immobilier</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --gold:#c8a96e; --gold-fonce:#b3945a; --dark:#1a1d23; --muted:#6b7280;
    --bg:#f7f5f1; --carte:#ffffff; --bordure:#e8e3d9; --encre:#3f4550; --gold-clair:#f4ead9; --vert:#1e3a32;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--dark); font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.55; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 18px 132px; }

  header { text-align:center; padding:22px 0 18px; }
  .marque { font-family:Georgia,'Times New Roman',serif; letter-spacing:5px; font-size:18px; font-weight:700; }
  .logo { display:block; height:108px; width:auto; max-width:86%; margin:0 auto; }
  .filet { width:54px; height:2px; background:var(--gold); margin:14px auto 0; }

  .intro { background:var(--carte); border:1px solid var(--bordure); border-radius:16px; padding:24px 26px; margin:18px 0 10px; box-shadow:0 2px 12px rgba(26,29,35,.05); }
  .intro h1 { font-family:Georgia,serif; font-size:22px; margin-bottom:8px; font-weight:600; }
  .intro p { color:var(--encre); font-size:15px; white-space:pre-line; }
  .intro .sig { margin-top:14px; color:var(--muted); font-size:13px; font-style:italic; }

  .meta { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:14px 0 22px; }

  h2 { font-family:Georgia,serif; font-weight:600; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { border:1px solid #ecdfc4; background:#fbf7ee; border-radius:20px; padding:5px 12px; font-size:12.5px; color:var(--encre); }
  .pitch { font-size:14px; color:var(--encre); margin:0 0 12px; }
  .atouts { list-style:none; margin:0 0 12px; font-size:13.5px; color:var(--encre); }
  .atouts li { padding-left:20px; position:relative; margin-bottom:3px; }
  .atouts li::before { content:"✦"; position:absolute; left:2px; color:var(--gold); font-size:11px; }

  /* Prix selon le régime de TVA — les deux régimes doivent toujours être visibles */
  .prix-blocs { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 4px; }
  .prix-bloc { flex:0 1 auto; min-width:0; border:1px solid #e0d9c8; border-radius:12px; padding:9px 14px; background:#faf8f4; }
  .prix-bloc.avantage { border-color:var(--gold); background:#fdfaf3; box-shadow:0 1px 6px rgba(200,169,110,.18); }
  .prix-bloc .regime { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .prix-bloc.avantage .regime { color:var(--gold); font-weight:700; }
  .prix-bloc .montant { font-family:Georgia,serif; font-size:19px; font-weight:700; color:var(--encre); }
  .prix-bloc .detail { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .prix-eco { display:inline-block; margin-top:6px; background:var(--gold); color:#fff; border-radius:20px; padding:2px 10px; font-size:11.5px; font-weight:700; }
  .prix-lois { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .prix-seule { font-family:Georgia,serif; font-size:16px; font-weight:700; color:var(--encre); margin:6px 0 4px; }

  /* Ville : intertitre quand la sélection couvre plusieurs communes */
  .ville-titre { display:flex; align-items:center; gap:12px; margin:38px 0 16px; padding-bottom:9px; border-bottom:2px solid var(--gold); scroll-margin-top:14px; }
  .ville-titre .ville-nom { font-family:Georgia,'Times New Roman',serif; font-size:23px; font-weight:700; color:var(--dark); letter-spacing:.2px; }
  .ville-titre .ville-cp { font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; font-weight:400; color:var(--muted); margin-left:7px; letter-spacing:.5px; }
  .ville-titre .ville-nb { margin-left:auto; background:var(--gold); color:#fff; border-radius:20px; padding:4px 13px; font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; }
  .ville-titre:first-of-type { margin-top:6px; }

  /* Sélection enrichie depuis la dernière visite du client */
  .maj-bandeau { display:flex; align-items:center; gap:11px; background:linear-gradient(180deg,#fdfaf3,#fbf6ea); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:12px; padding:12px 15px; margin:16px 0 4px; box-shadow:0 2px 8px rgba(200,169,110,.16); }
  .maj-bandeau b { font-family:Georgia,serif; font-size:14.5px; color:var(--dark); }
  .maj-bandeau span { font-size:13px; color:var(--muted); }

  /* Villes en tête de sélection : un raccourci vers chaque commune */
  .villes-tete { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px; }
  .ville-chip { display:flex; align-items:baseline; gap:7px; background:#fff; border:1px solid var(--gold); border-radius:22px; padding:7px 15px; text-decoration:none; transition:all .15s; }
  .ville-chip b { font-family:Georgia,serif; font-size:14px; font-weight:600; color:var(--dark); }
  .ville-chip span { font-size:12px; color:var(--gold-fonce); font-weight:600; }
  .ville-chip:hover { background:var(--gold); box-shadow:0 2px 8px rgba(200,169,110,.3); }
  .ville-chip:hover b, .ville-chip:hover span { color:#fff; }

  /* ---- Carte bien / programme (format unique, "toute la maquette") ---- */
  .card { background:var(--carte); border:1px solid var(--bordure); border-radius:16px; overflow:hidden; margin-bottom:24px; box-shadow:0 2px 12px rgba(26,29,35,.05);
          opacity:0; transform:translateY(18px); transition:opacity .5s ease, transform .5s ease; }
  .card.vue { opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce){ .card { opacity:1; transform:none; transition:none; } }


  .body-card { padding:22px 24px 4px; }
  .eyebrow { color:var(--gold-fonce); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; margin-bottom:4px; }
  .titre-prog { font-size:20px; margin-bottom:10px; }

  /* Adresse + carte OSM (gardée : un vrai plus visuel, même si la maquette ne l'illustrait pas) */
  .adresse-row { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--encre); padding:14px 0 12px; border-top:1px solid var(--bordure); }
  .adresse-row svg { flex:none; }
  .adresse-row span { flex:1; min-width:0; }
  .adresse-row > a { margin-left:auto; color:var(--gold-fonce); font-weight:600; font-size:12.5px; white-space:nowrap; text-decoration:none; }
  .adresse-row > a:hover { text-decoration:underline; }
  /* Lignes de transport à proximité (métro / RER / train / tram — jamais de bus), 30/09/2026 */
  .transports-row { display:flex; flex-wrap:wrap; gap:6px; padding:0 0 12px; }
  .transport-chip { display:inline-flex; align-items:center; gap:5px; background:var(--gold-clair); border:1px solid var(--bordure); border-radius:20px; padding:4px 10px 4px 8px; font-size:12px; color:var(--encre); }
  .transport-dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .transport-gare { color:var(--muted); }
  .carte { position:relative; height:150px; border-radius:12px; overflow:hidden; border:1px solid var(--bordure); background:#eceae4; cursor:pointer; margin-bottom:10px; }
  .carte-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:0; }
  .carte .pin { position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-30px 0 0 -11px; opacity:0; }
  .carte.vue .pin { animation:tombe .55s cubic-bezier(.3,1.4,.5,1) .15s forwards; }
  @keyframes tombe { 0% { opacity:0; transform:translateY(-26px) scale(.85); } 60% { opacity:1; transform:translateY(2px) scale(1); } 100% { opacity:1; transform:translateY(0) scale(1); } }
  .adr-btns { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .adr-btn { border:1px solid var(--bordure); background:#fff; color:var(--encre); border-radius:10px; padding:7px 13px; font-size:12.5px; font-weight:600; text-decoration:none; transition:all .15s; }
  .adr-btn:hover { border-color:var(--gold); color:var(--gold-fonce); }
  .adr-demande { border:1px dashed var(--gold); background:#fffdf8; color:var(--gold-fonce); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; margin:2px 0 12px; }
  .adr-demande:hover { background:var(--gold); color:#fff; border-style:solid; }
  .adr-demande[disabled] { opacity:.75; cursor:default; border-style:solid; }

  /* Documents du programme : plaquette + plan de masse, en pastilles */
  .docs-row { display:flex; gap:10px; flex-wrap:wrap; padding:2px 0 18px; border-bottom:1px solid var(--bordure); }
  .doc-pill { display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--gold); color:var(--gold-fonce); background:var(--gold-clair); border-radius:22px; padding:8px 15px; font-size:12.5px; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
  .doc-pill:hover { background:var(--gold); color:#fff; }
  .doc-pill .chev { transition:transform .2s ease; }
  .doc-pill.active .chev, [data-plan-toggle].active .chev { transform:rotate(180deg); }

  /* Panneau qui glisse : plan du lot / plan de masse (choix d'Alex, septembre 2026) */
  .plan-slide { display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease; }
  .plan-slide.open { grid-template-rows:1fr; }
  .plan-slide-inner { overflow:hidden; }
  .plan-panel { margin:12px 0 4px; border:1px solid var(--gold); border-radius:12px; overflow:hidden; background:#faf9f6; box-shadow:0 4px 14px rgba(26,29,35,.06); }
  .plan-panel .plan-head { display:flex; align-items:center; justify-content:space-between; background:var(--gold-clair); padding:9px 14px; font-size:11.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--gold-fonce); }
  .plan-panel .ph-img { position:relative; background:#fff; padding:14px; text-align:center; }
  .plan-panel .ph-img img { max-width:100%; max-height:420px; object-fit:contain; }
  .plan-panel .ph-pdf { position:relative; padding:14px; background:#fff; }
  /* PDF affiché en direct dans un cadre intégré, comme sur la carte (apercuDoc) : le
     document se voit tout de suite, il n'ouvre jamais un nouvel onglet ni ne dépend du
     réglage PDF du navigateur du client (30/09/2026 — bug remonté par Alex : « demande de
     télécharger » sur certains navigateurs alors que ça s'affiche bien sur la carte). */
  .plan-panel .ph-pdf iframe { display:block; width:100%; height:60vh; min-height:340px; max-height:640px; border:1px solid var(--bordure); border-radius:8px; background:#f3f1ea; }
  .dl-btn { position:absolute; right:12px; bottom:12px; display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--gold); color:var(--gold-fonce); border-radius:18px; padding:7px 13px; font-size:12px; font-weight:700; text-decoration:none; box-shadow:0 3px 10px rgba(26,29,35,.14); }
  .dl-btn:hover { background:var(--gold); color:#fff; }
  .ph-pdf .dl-btn { position:static; margin-top:10px; }

  /* Offres commerciales négociées par le conseiller */
  .remises { display:flex; flex-direction:column; gap:7px; margin:0 0 12px; }
  .remise { display:flex; align-items:center; gap:11px; background:linear-gradient(180deg,#fdfaf3,#fbf6ea); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:12px; padding:10px 14px; box-shadow:0 2px 8px rgba(200,169,110,.16); }
  .remise .offre-tag { font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:#fff; background:var(--gold); border-radius:4px; padding:3px 7px; white-space:nowrap; }
  .remise .offre-txt { font-size:13.5px; font-weight:600; color:var(--dark); }
  .remise .offre-montant { margin-left:auto; font-family:Georgia,serif; font-size:17px; font-weight:700; color:var(--gold-fonce); white-space:nowrap; }
  /* Le mot du conseiller sous un lot */
  .mot { background:#faf8f4; border:1px solid var(--bordure); border-left:4px solid var(--gold); border-radius:12px; padding:11px 14px; margin:0 0 12px; }
  .mot-qui { font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:var(--gold-fonce); margin-bottom:4px; }
  .mot-txt { font-size:14px; line-height:1.5; color:var(--dark); white-space:pre-wrap; }

  .annexes-lot { font-size:12px; color:var(--encre); margin:0 0 10px; }
  .annexes-lot span { display:inline-block; border:1px dashed var(--gold); border-radius:20px; padding:3px 11px; margin:3px 5px 0 0; }

  /* Mensualité estimée sur un lot concerné par la simulation, avec l'économie mensuelle */
  .simu-lot { display:flex; flex-direction:column; gap:5px; background:#faf8f4; border:1px solid #eee8db; border-radius:10px; padding:9px 13px; margin:0 0 12px; font-size:13.5px; }
  .simu-lot-ligne { display:flex; align-items:center; gap:8px; }
  .simu-lot-label { color:var(--muted); }
  .simu-lot-montant { margin-left:auto; font-family:Georgia,serif; font-weight:700; color:var(--dark); }
  .simu-lot-eco { font-size:12px; color:var(--gold-fonce); font-weight:600; }
  .simu-lot-txt { color:var(--muted); }

  /* ---- Lots dans une carte ---- */
  .lots { padding:0 24px; }
  .lot-row { padding:16px 0; border-bottom:1px solid #f0ede4; }
  .lot-row:last-child { border-bottom:none; }
  .lot-row-top { display:flex; align-items:flex-start; gap:14px; margin-bottom:8px; }
  .lot-nom { font-weight:700; font-size:14.5px; }
  .lot-nouveau { color:var(--gold-fonce); font-weight:700; font-size:11px; }
  .lot-faits { font-size:12px; color:var(--muted); margin-top:2px; }
  .lot-prix { font-family:Georgia,serif; font-weight:700; font-size:16px; text-align:right; white-space:nowrap; }

  .lot-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0; flex-wrap:wrap; }
  .plan-btn { display:inline-flex; align-items:center; gap:7px; border:none; background:var(--gold); color:#fff; border-radius:20px; padding:8px 15px; font-size:12.5px; font-weight:700; flex:none; cursor:pointer; font-family:inherit; }
  .plan-btn:hover { background:var(--gold-fonce); }
  .chev { flex:none; transition:transform .2s ease; }

  .avis-mini { display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex:none; }
  .avis-ico { width:32px; height:32px; border-radius:50%; border:1px solid var(--bordure); background:#fff; display:flex; align-items:center; justify-content:center; flex:none; font-size:14px; cursor:pointer; font-family:inherit; transition:all .15s; }
  .avis-ico:hover { border-color:var(--gold); }
  .avis-ico.selected { background:var(--gold); border-color:var(--gold); color:#fff; }
  .avis-ico[data-avis="a_discuter"].selected { background:var(--dark); border-color:var(--dark); }
  .avis-ico[data-avis="pas_pour_moi"].selected { background:#8a8f99; border-color:#8a8f99; }
  .avis-save { background:var(--vert); color:#fff; border:none; border-radius:14px; padding:0 13px; font-size:11.5px; font-weight:700; font-family:inherit; cursor:pointer; flex:none; height:32px; }
  .avis-save:hover { background:#152a24; }
  .avis-save:disabled { opacity:.65; cursor:default; }

  .opt { display:flex; align-items:flex-start; gap:10px; margin:0 0 10px; padding:10px 12px; border:1px solid #ddd6c8; border-radius:12px; background:#faf8f4; cursor:pointer; font-size:13px; line-height:1.4; }
  .opt input { margin:3px 0 0; width:16px; height:16px; accent-color:var(--gold); cursor:pointer; flex:none; }
  .opt.on { border-color:var(--gold); background:#fbf6ec; }
  .opt small { display:block; color:var(--muted); font-size:11.5px; margin-top:2px; }

  .lot-comment { display:flex; gap:8px; align-items:center; margin-top:2px; }
  .lot-comment input { flex:1; min-width:0; border:1px solid var(--bordure); background:#fbfaf8; border-radius:20px; padding:9px 14px; font-size:12.5px; font-family:inherit; color:var(--dark); outline:none; }
  .lot-comment input:focus { border-color:var(--gold); }
  .lot-comment input::placeholder { color:#a19c90; }
  .lot-comment button { border:none; background:var(--vert); color:#fff; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; }
  .lot-comment button:disabled { opacity:.6; cursor:default; }

  .bas-card { height:16px; }

  .comp-invite { background:#fff; border:1px solid var(--gold); border-radius:16px; padding:22px 24px; margin:2px 0 22px; text-align:center; box-shadow:0 2px 10px rgba(200,169,110,.15); }
  .comp-invite h3 { font-family:Georgia,serif; font-size:18px; font-weight:600; margin-bottom:6px; }
  .comp-invite p { font-size:13.5px; color:var(--muted); margin-bottom:14px; }
  .comp-invite button { border:none; background:var(--gold); color:#fff; border-radius:12px; padding:13px 26px; font-size:14.5px; font-weight:700; cursor:pointer; transition:background .15s; }
  .comp-invite button:hover { background:var(--gold-fonce); }

  /* Gros pavé "prenez un créneau" en fin de page — repris de l'ancien design (30/09/2026, Alex :
     "j'aimais bien l'ancien gros carré"), en plus de la barre du bas qui reste toujours disponible
     en scrollant. Les boutons réutilisent la classe .rdv-format : ouvrirBulle()/brancherBarre() les
     câblent automatiquement (recherche document-wide), aucun code de clic séparé n'est nécessaire. */
  .cta-rdv { background:var(--vert); border-radius:18px; padding:28px 24px; margin:2px 0 22px; text-align:center; box-shadow:0 4px 18px rgba(30,58,50,.22); }
  .cta-rdv h3 { font-family:Georgia,serif; font-size:19px; font-weight:600; margin-bottom:7px; color:#fff; }
  .cta-rdv p { font-size:13.5px; color:rgba(255,255,255,.82); margin:0 auto 18px; max-width:420px; }
  .cta-rdv .rdv-choix { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .cta-rdv .rdv-format { background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.55); min-width:100px; height:58px; font-size:12px; }
  .cta-rdv .rdv-format small { opacity:.9; }
  .cta-rdv .rdv-format:hover { background:rgba(255,255,255,.24); }
  .cta-rdv .rdv-format.active { background:#fff; color:var(--vert); border-color:#fff; }
  .cta-rdv .rdv-format-ok { background:#fff; color:var(--vert); border-color:#fff; min-width:140px; }

  /* Rubrique Financement : résumé de la simulation, à part, juste après le bandeau .meta */
  .financement { background:var(--carte); border:1px solid var(--gold); border-radius:16px; padding:22px 24px; margin:4px 0 22px; box-shadow:0 2px 12px rgba(200,169,110,.15); }
  .financement-eyebrow { color:var(--gold-fonce); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; margin-bottom:8px; }
  .financement-montant { font-family:Georgia,serif; font-size:24px; font-weight:700; color:var(--dark); margin-bottom:6px; }
  .financement-date { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .financement-cta { display:inline-block; border:1px solid var(--gold); color:var(--gold-fonce); background:#fff; border-radius:12px; padding:10px 20px; font-size:13.5px; font-weight:700; text-decoration:none; transition:background .15s,color .15s; }
  .financement-cta:hover { background:var(--gold); color:#fff; }
  .financement-detail-lien { display:block; margin-top:12px; background:none; border:none; padding:0; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:inherit; }
  .financement-detail-lien:hover { color:var(--gold-fonce); }
  .financement-detail { margin-top:14px; padding-top:14px; border-top:1px solid var(--bordure); }
  .financement-detail p { font-size:13.5px; color:var(--encre); line-height:1.55; margin-bottom:10px; }
  .financement-detail ul { list-style:none; margin:0; }
  .financement-detail li { padding-left:19px; position:relative; margin-bottom:6px; font-size:13px; color:var(--encre); line-height:1.4; }
  .financement-detail li::before { content:"✦"; position:absolute; left:1px; top:1px; color:var(--gold); font-size:11px; }

  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:8px; }
  .partage { margin-top:12px; }
  .partage button { border:1px solid #ddd6c8; background:#fff; border-radius:20px; padding:7px 16px; font-size:12.5px; color:var(--encre); cursor:pointer; }
  .partage button:hover { border-color:var(--gold); }

  /* ---- Barre du bas : progression + prise de rendez-vous, fusionnées (choix d'Alex, 29/09/2026) ---- */
  .rdv-wrap { position:fixed; left:0; right:0; bottom:0; z-index:40; transform:translateY(110%); transition:transform .3s ease; }
  .rdv-wrap.show { transform:none; }
  #barre { background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-top:1px solid var(--bordure); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .barre-in { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .barre-prog { flex:1; min-width:100px; }
  .prog-txt { font-size:11.5px; color:var(--muted); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog-fond { height:5px; background:#ece7dc; border-radius:3px; overflow:hidden; }

  function nomLot(b){
    var t = String((b && b.titre) || "").trim();
    var m = t.match(RE_LOT);
    return m ? m[1].trim() : "";
  }
  function cleProgramme(b){
    var t = nomProgramme(b).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    t = t.replace(/\b(le|la|les|du|des|de|d|l|un|une|chapitre|tranche|phase|\d+)\b/g, " ");
    return t.replace(/[^a-z]/g, "");
  }
  function memeProgramme(a, b){
    var ka = cleProgramme(a), kb = cleProgramme(b);
    if (ka && kb){
      var court = ka.length <= kb.length ? ka : kb, long = ka.length <= kb.length ? kb : ka;
      if (ka === kb || (court.length >= 8 && long.indexOf(court) >= 0)) return true;
    }
    return !!(a.adresseOk && b.adresseOk && a.adresse && a.adresse === b.adresse && (a.ville || "") === (b.ville || ""));
  }
  function grouperParProgramme(items){
    var progs = [];
    items.forEach(function(o){
      var p = null;
      for (var k = 0; k < progs.length; k++) if (memeProgramme(progs[k].items[0].b, o.b)) { p = progs[k]; break; }
      if (!p) { p = { items: [] }; progs.push(p); }
      p.items.push(o);
    });
    return progs;
  }
  function nbProgrammes(liste){
    var n = 0;
    grouperParVille(liste).forEach(function(gr){ n += grouperParProgramme(gr.items).length; });
    return n;
  }
  function premier(items, champ){
    for (var k = 0; k < items.length; k++){ var v = items[k].b && items[k].b[champ]; if (v && (!Array.isArray(v) || v.length)) return v; }
    return "";
  }

  function photoDe(b){
    if (b.image) return b.image;
    if (Array.isArray(b.images) && b.images.length) return b.images[0];
    return "";
  }
  function visuelDe(b){
    if (b.planImg) return { url: b.planImg, plan: true };
    var p = photoDe(b);
    if (p) return { url: p, plan: false };
    if (b.plan && !/\.pdf(?:$|\?)/i.test(String(b.plan))) return { url: b.plan, plan: true };
    return { url: "", plan: false };
  }
  function estPdf(u){ return /\.pdf(?:$|\?)/i.test(String(u || "")); }
  function planEntier(b){ return (b.plan && !estPdf(b.plan)) ? b.plan : (b.planImg || ""); }
  // Toutes les vues du plan d'un lot (duplex, maison à étages) : b.plans si le
  // serveur en a trouvé plusieurs, sinon la seule image disponible comme avant
  // (30/09/2026 — demande d'Alex : « s'il existe plusieurs images, les afficher »).
  function planUrlsDe(b){
    if (Array.isArray(b.plans) && b.plans.length > 1){
      var v = b.plans.filter(function(u){ return u && !estPdf(u); });
      if (v.length) return v;
    }
    var u = planEntier(b);
    return u ? [u] : [];
  }
  function imagesDe(b){
    var v = visuelDe(b), pl = planEntier(b), ph = photoDe(b), l = [];
    if (v.plan && pl) l.push(pl);
    if (ph) l.push(ph);
    if (Array.isArray(b.images)) b.images.forEach(function(u){ if (u && l.indexOf(u) < 0) l.push(u); });
    if (!v.plan && pl) l.push(pl);
    return l;
  }
  function fmtDate(d){
    try { return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); } catch(e){ return ""; }
  }

  function ecranVide(titre, texte){
    cont.className = "etat";
    cont.innerHTML = "<h2>" + esc(titre) + "</h2><p>" + esc(texte) + "</p>";
  }

  if (!token) { ecranVide("Lien introuvable", "Ce lien de sélection n'existe pas ou a expiré. Rapprochez-vous de votre conseiller GLR Immobilier."); return; }

  // ---------- Avis (icônes + bouton Enregistrer, choix d'Alex du 29/09/2026) ----------
  function htmlAvisMini(i){
    var a = etatAvis[String(i)] || {};
    var choix = a.choix || "";
    function ic(c, sym, titre){
      return "<button type='button' class='avis-ico" + (choix === c ? " selected" : "") + "' data-avis='" + c + "' title='" + esc(titre) + "'>" + sym + "</button>";
    }
    var h = "<div class='avis-mini' data-i='" + i + "'>";
    h += ic("interesse", "✓", "Ça m'intéresse");
    h += ic("a_discuter", "~", "À discuter");
    h += ic("pas_pour_moi", "✕", "Pas pour moi");
    h += "<button type='button' class='avis-save' hidden>Enregistrer</button>";
    h += "</div>";
    return h;
  }
  function htmlOption(i, a){
    return "<label class='opt" + (a.option ? " on" : "") + "' data-opt='" + i + "'><input type='checkbox'" + (a.option ? " checked" : "") + "><span>Je souhaite que vous posiez une option sur ce lot<small>Sans engagement : le lot est bloqué pour vous quelques jours, le temps d'en parler.</small></span></label>";
  }
  function htmlLotComment(i, texte){
    return "<div class='lot-comment' data-com='" + i + "'><input type='text' maxlength='1000' placeholder='Un commentaire pour votre conseiller ?' value=\"" + esc(texte || "") + "\"><button type='button' aria-label='Envoyer'>" + ICO_ENVOYER + "</button></div>";
  }

  // ---------- Rendu d'un lot, en ligne compacte, dans une carte ----------
  function htmlLotRow(b, i, d){
    var a = etatAvis[String(i)] || {};
    var nl = nomLot(b) || b.titre || ("Bien " + (i + 1));
    var faits = [b.surface, b.etage ? "Étage " + b.etage : "", b.terrasse, b.expo].filter(Boolean).join(" · ");
    var h = "<div class='lot-row' data-carte='" + i + "'>";
    h += "<div class='lot-row-top'>";
    h += "<div style='flex:1;min-width:0'><div class='lot-nom'>" + esc(nl) + (b.nouveau ? " <span class='lot-nouveau'>· Nouveau</span>" : "") + "</div>";
    if (faits) h += "<div class='lot-faits'>" + esc(faits) + "</div>";
    h += "</div>";
    h += "<div class='lot-prix'>" + htmlPrixResume(b) + "</div>";
    h += "</div>";
    // Le détail des régimes de TVA n'est réaffiché sous le prix que s'il y a
    // vraiment plusieurs régimes à comparer — sinon on répéterait le même prix
    // deux fois (déjà visible en tête de ligne).
    var optsTva = Array.isArray(b.prixOptions) ? b.prixOptions.filter(function(o){ return o && o.prixTexte; }) : [];
    if (optsTva.length > 1) h += htmlPrix(b);
    h += htmlRemises(b);
    h += htmlNote(b, d);
    h += htmlSimulationLot(b, d);
    var annexes = Array.isArray(b.annexes) ? b.annexes : (b.parking ? [{ type: "Parking", nom: b.parking }] : []);
    if (annexes.length){
      h += "<div class='annexes-lot'>" + annexes.map(function(x){
        var nom = String(x.nom || ""), type = String(x.type || "");
        var t = (nom && type && nom.toLowerCase().indexOf(type.toLowerCase()) === 0) ? nom : [type, nom].filter(Boolean).join(" ");
        return "<span>" + esc(t || "Annexe") + (x.surface ? " · " + esc(x.surface) : "") + (x.prix ? " · " + esc(x.prix) : "") + "</span>";
      }).join("") + "</div>";
    }
    var visu = visuelDe(b);
    var planUrls = visu.plan ? planUrlsDe(b) : [];
    if (visu.plan && !planUrls.length && visu.url) planUrls = [visu.url];
    var planUrl = planUrls[0] || "";
    var docsMulti = (!b.lien && Array.isArray(b.docs)) ? b.docs.filter(function(x){ return x && x.url; }) : [];
    // Le plan du lot (une ou plusieurs vues) est déjà montré dans le panneau
    // "Voir le plan du lot" ci-dessous : pas la peine de le lister une seconde
    // fois comme document séparé (30/09/2026).
    if (docsMulti.length) docsMulti = docsMulti.filter(function(x){ return !(b.plaquette && x.url === b.plaquette) && !(b.masse && x.url === b.masse) && !/^plan du lot/i.test(x.nom || ""); });
    // Lien Otaree dont on a pu identifier au moins un document (plan, plan de
    // masse ou plaquette) : ceux-ci sont déjà proposés ailleurs (bouton "Voir
    // le plan du lot", case plaquette/plan de masse au niveau du programme) —
    // plus besoin de renvoyer aussi vers la fiche Otaree brute (29/09/2026).
    var docsOtareeTrouves = !!(b.lien && (b.plan || b.masse || b.plaquette));
    var idPlanLot = "lot-" + i;
    h += "<div class='lot-actions'>";
    if (planUrl) h += "<button type='button' class='plan-btn' data-plan-toggle='" + idPlanLot + "'>" + ICO_PLAN + "<span class='lbl' data-open='Voir le plan du lot' data-close='Masquer le plan'>Voir le plan du lot</span>" + ICO_CHEV + "</button>";
    // Le bouton générique "Fiche et plans du lot" ne doit revenir que si aucun
    // document du lot n'est déjà proposé ailleurs (plan du lot, plan de masse ou
    // plaquette du programme) — sinon il fait doublon. Avant le 30/09/2026, il
    // réapparaissait sur tout lot venu de la carte (b.lien toujours vide pour ces
    // lots, donc docsOtareeTrouves toujours faux) même quand plan/masse/plaquette
    // étaient déjà tous affichés — bug remonté par Alex.
    if (docsMulti.length){
      docsMulti.forEach(function(x){ h += "<a class='doc-pill' href='" + esc(x.url) + "' target='_blank' rel='noopener'>" + ICO_DOC + esc(x.nom || "Document") + "</a>"; });
    } else if (!docsOtareeTrouves && !planUrl && !b.masse && !b.plaquette) {
      var lienDoc = htmlLienDoc(b);
      if (lienDoc) h += "<a class='doc-pill' href='" + esc(lienDoc) + "' target='_blank' rel='noopener'>" + ICO_DOC + "Fiche et plans du lot</a>";
    }
    h += htmlAvisMini(i);
    h += "</div>";
    if (planUrl) h += htmlPlanSlide(idPlanLot, "Plan du lot" + (nomLot(b) ? " — " + nomLot(b) : ""), planUrls);
    h += htmlOption(i, a);
    h += htmlLotComment(i, a.commentaire);
    h += "</div>";
    return h;
  }
  function htmlLienDoc(b){
    var joints = Array.isArray(b.docs) && b.docs.length
      ? b.docs
      : (b.pdf ? [{ nom: "Fiche du lot", url: b.pdf }] : []);
    var lienDoc = b.lien || "";
    if (!lienDoc){
      for (var jd = 0; jd < joints.length; jd++){
        var uj = joints[jd] && (joints[jd].url || (typeof joints[jd] === "string" ? joints[jd] : ""));
        if (uj){ lienDoc = uj; break; }
      }
    }
    return lienDoc || b.plan || b.masse || "";
  }
  function htmlDocsProgramme(items){
    var plaquette = premier(items, "plaquette"), masse = premier(items, "masse");
    if (!plaquette && !masse) return "";
    var idMasse = "masse-" + items[0].i;
    var h = "<div class='docs-row'>";
    if (plaquette) h += "<a class='doc-pill' href='" + esc(plaquette) + "' target='_blank' rel='noopener'>" + ICO_DOC + "Plaquette du programme</a>";
    if (masse) h += "<button type='button' class='doc-pill' data-plan-toggle='" + idMasse + "'>" + ICO_DOC + "<span class='lbl' data-open='Plan de masse' data-close='Masquer le plan de masse'>Plan de masse</span>" + ICO_CHEV + "</button>";
    h += "</div>";
    if (masse) h += htmlPlanSlide(idMasse, "Plan de masse", masse);
    return h;
  }

  // ---------- Rendu d'une carte : un programme (même à un seul lot) ----------
  function htmlCarte(pg, d){
    var items = pg.items, b0 = items[0].b, i0 = items[0].i, n = items.length;
    var nom = nomProgramme(b0) || b0.titre || "Bien";
    var h = "<div class='card'>";
    var bAdr = null, iAdr = i0;
    for (var m = 0; m < n; m++){ if (adresseSure(items[m].b)){ bAdr = items[m].b; iAdr = items[m].i; break; } }
    // Vignette en tête de carte retirée le 30/09/2026 (demande d'Alex, après le cas Beau
    // Chemin où Otaree avait renvoyé le plan de masse à la place d'une photo du bâtiment,
    // puis après un essai de mini-carte Mapbox en remplacement jugé encore trop proche de
    // l'ancien "gros carré" — Alex : « juste enlever la photo du programme »). La carte va
    // directement du titre/chips/pitch au bloc adresse (qui garde sa propre petite carte
    // Mapbox, inchangée) : plus aucune image en tête de carte, jamais de risque d'affichage
    // faux ou flou. Ne pas réintroduire de vignette ici sans un nouvel arbitrage explicite.
    h += "<div class='body-card'>";
    h += "<div class='eyebrow'>" + esc(b0.ville || "") + "</div>";
    h += "<h2 class='titre-prog'>" + esc(nom) + "</h2>";
    var puces = [];
    var promoteur = premier(items, "promoteur"), livraison = premier(items, "livraison"), nature = premier(items, "nature");
    if (nature) puces.push(nature);
    if (promoteur) puces.push(promoteur);
    if (livraison) puces.push("Livraison " + livraison);
    var typs = [];
    items.forEach(function(o){ (Array.isArray(o.b.typologies) ? o.b.typologies : []).forEach(function(t){ if (t && typs.indexOf(t) < 0) typs.push(t); }); });
    if (typs.length) puces.push(typs.join(" · "));
    if (puces.length) h += "<div class='chips'>" + puces.map(function(t){ return "<span class='chip'>" + esc(t) + "</span>"; }).join("") + "</div>";
    var pitch = premier(items, "pitch");
    if (pitch) h += "<p class='pitch'>" + esc(pitch) + "</p>";
    var atouts = premier(items, "atouts");
    if (Array.isArray(atouts) && atouts.length) h += "<ul class='atouts'>" + atouts.slice(0, 5).map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";

    if (bAdr) h += htmlAdresse(bAdr, iAdr, etatAvis[String(iAdr)] || {});
    else {
      var demandee = items.some(function(o){ return (etatAvis[String(o.i)] || {}).adresse_demandee; });
      h += htmlAdresse(b0, i0, { adresse_demandee: demandee });
    }
    h += htmlDocsProgramme(items);
    h += "</div>";

    h += "<div class='lots'>";
    items.forEach(function(o){ h += htmlLotRow(o.b, o.i, d); });
    h += "</div>";
    h += "<div class='bas-card'></div>";
    h += "</div>";
    return h;
  }

  // ---------- Rendu ----------
  function rendre(d){
    donneesCourantes = d;
    biens = Array.isArray(d.biens) ? d.biens : [];
    etatAvis = d.avis || {};
    var prenom = d.prenom || "";
    var destinataire = (d.salutation || "").trim() || prenom;
    var h = "";
    var groupes = grouperParVille(biens);
    h += "<div class='intro'><h1>Bonjour" + (destinataire ? " " + esc(destinataire) : "") + ",</h1>";
    h += "<p>" + esc(d.message || "Voici une sélection de biens correspondant à vos critères.") + "</p>";
    if (d.vendeur) h += "<div class='sig'>— " + esc(d.vendeur) + ", votre conseiller GLR Immobilier</div>";
    h += "</div>";
    var nbProg = nbProgrammes(biens);
    h += "<div class='meta'><span>" + biens.length + " bien" + (biens.length > 1 ? "s" : "") + " sélectionné" + (biens.length > 1 ? "s" : "") + " pour vous"
      + (nbProg > 1 && nbProg < biens.length ? " · " + nbProg + " résidences" : "") + "</span>";
    if (d.expires_at) h += "<span>·</span><span>Sélection valable jusqu'au " + esc(fmtDate(d.expires_at)) + "</span>";
    h += "</div>";

    h += htmlFinancement(d);

    var nbNeufsTotal = biens.filter(function(b){ return b && b.nouveau; }).length;
    if (nbNeufsTotal){
      h += "<div class='maj-bandeau'><b>" + nbNeufsTotal + " nouveau" + (nbNeufsTotal > 1 ? "x" : "") + " bien"
        + (nbNeufsTotal > 1 ? "s" : "") + "</b><span>ajouté" + (nbNeufsTotal > 1 ? "s" : "")
        + " à votre sélection depuis votre dernière visite</span></div>";
    }

    if (groupes.length > 1){
      h += "<div class='villes-tete'>" + groupes.map(function(gr, k){
        var v = villeEnDeux(gr.ville);
        return "<a class='ville-chip' href='#ville-" + k + "'><b>" + esc(v.nom) + "</b><span>" + gr.items.length + " bien" + (gr.items.length > 1 ? "s" : "") + "</span></a>";
      }).join("") + "</div>";
    }

    groupes.forEach(function(gr, k){
      if (groupes.length > 1){
        var vv = villeEnDeux(gr.ville);
        h += "<div class='ville-titre' id='ville-" + k + "'><div class='ville-nom'>" + esc(vv.nom)
          + (vv.cp ? "<span class='ville-cp'>" + esc(vv.cp) + "</span>" : "")
          + "</div><div class='ville-nb'>" + gr.items.length + " bien" + (gr.items.length > 1 ? "s" : "") + "</div></div>";
      }
      grouperParProgramme(gr.items).forEach(function(pg){ h += htmlCarte(pg, d); });
    });

    if (biens.length >= 2){
      h += "<div class='comp-invite'><h3>Hésitation entre plusieurs lots ?</h3>";
      h += "<p>Mettez-les côte à côte : prix, surface, étage, exposition et livraison dans un seul tableau.</p>";
      h += "<button id='comp-ouvrir'>Comparer les " + biens.length + " biens</button></div>";
    }

    h += "<div id='cta-rdv-zone'></div>";

    h += "<footer>" + (biens.length === 1 ? "Donnez votre avis sur ce bien" : "Donnez votre avis sur chaque bien") + " : votre conseiller adaptera la prochaine sélection.";
    h += "<div class='partage'><button id='btn-partage'>Partager cette sélection</button></div>";
    h += "<div style='margin-top:14px'>GLR Immobilier</div></footer>";

    cont.className = "";
    cont.innerHTML = h;
    brancher(d);
    majRdvUI(d);
    majProgression();
    document.getElementById("rdv-wrap").classList.add("show");
    tpsDemarrer();
    if (biens.length >= 2) document.getElementById("btn-comp").style.display = "";

    if ("IntersectionObserver" in window){
      var obs = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("vue"); obs.unobserve(e.target); } });
      }, { threshold: 0.08 });
      Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){ obs.observe(c); });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){ c.classList.add("vue"); });
    }
  }

  // ---------- Interactions ----------
  function majProgression(){
    var n = biens.length, fait = 0;
    for (var i = 0; i < n; i++){ if ((etatAvis[String(i)] || {}).choix) fait++; }
    var txt = document.getElementById("prog-txt");
    var barre = document.getElementById("prog-rempli");
    if (fait >= n && n > 0){
      txt.textContent = "✓ Merci ! Votre avis est complet — votre conseiller revient vers vous.";
    } else {
      txt.textContent = "Votre avis : " + fait + " / " + n + " bien" + (n > 1 ? "s" : "");
    }
    barre.style.width = (n ? Math.round(100 * fait / n) : 0) + "%";
  }

  function ouvrirLb(i, j){
    lbBien = i; lbIdx = j;
    majLb();
    document.getElementById("lb").classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function fermerLb(){
    document.getElementById("lb").classList.remove("show");
    document.body.style.overflow = "";
  }
  function majLb(){
    var bl = biens[lbBien] || {};
    var imgs = imagesDe(bl);
    if (lbIdx < 0) lbIdx = imgs.length - 1;
    if (lbIdx >= imgs.length) lbIdx = 0;
    var u = imgs[lbIdx] || "";
    var estPlan = !!u && (u === planEntier(bl) || u === (bl.planImg || ""));
    var el = document.getElementById("lb-img");
    el.className = estPlan ? "plan" : "";
    el.src = u;
    var lien = document.getElementById("lb-ouvrir");
    if (lien){ lien.style.display = estPlan ? "" : "none"; lien.href = (estPlan && bl.plan) ? bl.plan : u; }
    document.getElementById("lb-num").textContent = (imgs.length > 1 ? (lbIdx + 1) + " / " + imgs.length + " — " : "") + (biens[lbBien].titre || "");
    document.getElementById("lb-prec").style.display = imgs.length > 1 ? "" : "none";
    document.getElementById("lb-suiv").style.display = imgs.length > 1 ? "" : "none";
  }

  function ouvrirComp(){
    var lignes = [
      ["Prix", function(b){ return b.prix || htmlPrixResume(b); }],
      ["Remise", function(b){ return remisesDe(b).map(texteRemise).join(" · "); }],
      ["Adresse", function(b){ return adresseSure(b) ? adresseTexte(b) : ""; }],
      ["Type", function(b){ return (Array.isArray(b.typologies) ? b.typologies.join(", ") : ""); }],
      ["Ville", function(b){ return b.ville; }],
      ["Surface", function(b){ return b.surface; }],
      ["Étage", function(b){ return b.etage; }],
      ["Terrasse / balcon", function(b){ return b.terrasse; }],
      ["Parking", function(b){ return b.parking; }],
      ["Exposition", function(b){ return b.expo; }],
      ["Livraison", function(b){ return b.livraison; }]
    ];
    var labels = { interesse: "Ça m'intéresse", a_discuter: "À discuter", pas_pour_moi: "Pas pour moi" };
    var h = "<table><thead><tr><th></th>";
    biens.forEach(function(b, i){ h += "<th>Bien " + (i + 1) + "<div style='font-weight:400;font-size:12px;color:var(--muted)'>" + esc(b.titre || "") + "</div></th>"; });
    h += "</tr></thead><tbody>";
    lignes.forEach(function(l){
      var vals = biens.map(function(b){ return l[1](b) || ""; });
      if (!vals.some(function(v){ return v; })) return;
      h += "<tr><td>" + l[0] + "</td>" + vals.map(function(v){ return "<td>" + (v ? esc(v) : "<span style='color:#c9c4b8'>—</span>") + "</td>"; }).join("") + "</tr>";
    });
    h += "<tr><td>Votre avis</td>" + biens.map(function(_, i){
      var c = (etatAvis[String(i)] || {}).choix;
      return "<td>" + (c ? labels[c] : "<span style='color:#c9c4b8'>—</span>") + "</td>";
    }).join("") + "</tr>";
    h += "</tbody></table>";
    document.getElementById("comp-corps").innerHTML = h;
    document.getElementById("comp").classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function fermerComp(){
    document.getElementById("comp").classList.remove("show");
    document.body.style.overflow = "";
  }

  // Câblage du rendez-vous — rejoué à chaque fois que la bulle est redessinée
  function brancherRdv(d){
    Array.prototype.forEach.call(document.querySelectorAll(".cren-jpill"), function(p){
      p.addEventListener("click", function(){
        var k = p.getAttribute("data-jour");
        Array.prototype.forEach.call(document.querySelectorAll(".cren-jpill"), function(x){ x.classList.toggle("on", x === p); });
        Array.prototype.forEach.call(document.querySelectorAll(".cren-heures"), function(x){ x.style.display = x.getAttribute("data-jour") === k ? "" : "none"; });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(btn){
      btn.addEventListener("click", function(){
        if (apercu){ toast("Mode aperçu conseiller — aucune action n'est transmise"); return; }
        if (btn.classList.contains("off")) return;
        var action = btn.getAttribute("data-action") || "reserver";
        if (!btn._confirme){
          demanderConfirmation({
            titre: action === "accepter_proposition" ? "Confirmer ce rendez-vous ?" : "Réserver ce créneau ?",
            quand: fmtJourLong(btn.getAttribute("data-debut")) + " à " + fmtHeure(btn.getAttribute("data-debut")),
            comment: FORMATS[formatChoisi].titre + " — " + FORMATS[formatChoisi].modeLbl.toLowerCase() + (d && d.vendeur ? " avec " + d.vendeur : ""),
            ok: action === "accepter_proposition" ? "Oui, je confirme" : "Oui, je réserve"
          }).then(function(daccord){
            if (!daccord) return;
            btn._confirme = true;
            btn.click();
            btn._confirme = false;
          });
          return;
        }
        Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.add("off"); });
        fetch(FN, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: action, creneau_id: btn.getAttribute("data-id"), mode: modeContact, format: formatChoisi, bien: rdvContexte })
        })
        .then(function(r){ return r.json().then(function(j){ return { statut: r.status, corps: j }; }); })
        .then(function(res){
          var c = res.corps && res.corps.creneau;
          if (res.corps && res.corps.ok && c){
            etatAvis.rdv = { demande: true, reserve: true, confirme: action === "accepter_proposition", refuse: false, debut: c.debut, fin: c.fin, mode: c.mode, lieu: c.lieu, format: formatChoisi };
            d.propositions = [];
            majRdvUI(d);
            var bulle = document.getElementById("rdv-bulle");
            if (bulle) bulle.classList.add("open");
            toast(action === "accepter_proposition" ? "✓ Rendez-vous confirmé" : "✓ Créneau réservé — en attente de confirmation");
            return;
          }
          if (res.corps && (res.corps.creneaux || res.corps.propositions)){
            if (res.corps.creneaux) d.creneaux = res.corps.creneaux;
            if (res.corps.propositions) d.propositions = res.corps.propositions;
            majBulle(d);
            toast("Ce créneau vient d'être pris — choisissez-en un autre");
            return;
          }
          Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.remove("off"); });
          toast("Réservation impossible — réessayez");
        })
        .catch(function(){
          Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.remove("off"); });
          toast("Réservation impossible — vérifiez votre connexion");
        });
      });
    });

    var btnBasculer = document.getElementById("rdv-basculer");
    if (btnBasculer) btnBasculer.addEventListener("click", function(){
      var zone = document.getElementById("rdv-libre");
      if (!zone) return;
      zone.style.display = "block";
      btnBasculer.style.display = "none";
      var inp = document.getElementById("rdv-creneau");
      if (inp) inp.focus();
    });

    var btnRdvEnvoyer = document.getElementById("rdv-envoyer");
    if (btnRdvEnvoyer) btnRdvEnvoyer.addEventListener("click", function(){
      var creneau = (document.getElementById("rdv-creneau").value || "").trim();
      envoyer({ action: "rdv", creneau: creneau, bien: rdvContexte, mode: modeContact, format: formatChoisi }, "✓ Demande de rendez-vous transmise").then(function(ok){
        if (!ok) return;
        etatAvis.rdv = { demande: true, creneau: creneau, mode: modeContact, format: formatChoisi };
        d.propositions = [];
        d.creneaux = [];
        majBulle(d);
      });
    });
  }

  function brancher(d){
    var finToggle = document.getElementById("financement-detail-toggle");
    if (finToggle) finToggle.addEventListener("click", function(){
      var panneau = document.getElementById("financement-detail");
      if (!panneau) return;
      var ouvert = finToggle.getAttribute("aria-expanded") === "true";
      panneau.hidden = ouvert;
      finToggle.setAttribute("aria-expanded", ouvert ? "false" : "true");
      finToggle.textContent = ouvert ? "Comment on arrive à ce montant ?" : "Masquer le détail";
    });


    // Panneaux qui glissent : plan du lot, plan de masse
    Array.prototype.forEach.call(document.querySelectorAll("[data-plan-toggle]"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-plan-toggle");
        var panneau = document.getElementById("plan-" + id);
        if (!panneau) return;
        var ouvrir = !panneau.classList.contains("open");
        panneau.classList.toggle("open", ouvrir);
        btn.classList.toggle("active", ouvrir);
        var lbl = btn.querySelector(".lbl");
        if (lbl) lbl.textContent = ouvrir ? lbl.getAttribute("data-close") : lbl.getAttribute("data-open");
      });
    });

    // Avis : icône sélectionnée puis bouton Enregistrer (choix d'Alex, 29/09/2026)
    Array.prototype.forEach.call(document.querySelectorAll(".avis-mini"), function(bloc){
      var i = parseInt(bloc.getAttribute("data-i"), 10);
      var save = bloc.querySelector(".avis-save");
      Array.prototype.forEach.call(bloc.querySelectorAll(".avis-ico"), function(btn){
        btn.addEventListener("click", function(){
          var actuel = (etatAvis[String(i)] || {}).choix || "";
          Array.prototype.forEach.call(bloc.querySelectorAll(".avis-ico"), function(b2){ b2.classList.remove("selected"); });
          btn.classList.add("selected");
          var c = btn.getAttribute("data-avis");
          if (save){
            if (c === actuel){ save.hidden = true; }
            else { save.hidden = false; save.disabled = false; save.textContent = "Enregistrer"; }
          }
        });
      });
      if (save) save.addEventListener("click", function(){
        if (save.disabled) return;
        var sel = bloc.querySelector(".avis-ico.selected");
        if (!sel) return;
        var choix = sel.getAttribute("data-avis");
        save.disabled = true; save.textContent = "Enregistrement…";
        envoyer({ action: "avis", index: i, choix: choix }, "✓ Merci, votre avis a bien été transmis").then(function(ok){
          if (!ok){ save.disabled = false; save.textContent = "Enregistrer"; return; }
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].choix = choix;
          majProgression();
          save.hidden = true;
          if (choix === "interesse"){ rdvContexte = biens[i] && biens[i].titre ? biens[i].titre : "Bien " + (i + 1); }
          majRdvUI(d);
        });
      });
    });

    // Demande d'option : la case part tout de suite, cochée ou décochée
    Array.prototype.forEach.call(document.querySelectorAll("[data-opt] input"), function(opt){
      var label = opt.closest("[data-opt]");
      var i = parseInt(label.getAttribute("data-opt"), 10);
      opt.addEventListener("change", function(){
        var veut = !!opt.checked;
        label.className = "opt" + (veut ? " on" : "");
        envoyer({ action: "avis", index: i, option: veut }, veut ? "✓ Bien noté, votre conseiller revient vers vous pour poser l'option" : "Demande d'option retirée").then(function(ok){
          if (!ok){ opt.checked = !veut; label.className = "opt" + (!veut ? " on" : ""); return; }
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].option = veut;
        });
      });
    });

    // Commentaire libre sous un lot : une ligne toujours visible
    Array.prototype.forEach.call(document.querySelectorAll("[data-com]"), function(zone){
      var i = parseInt(zone.getAttribute("data-com"), 10);
      var inp = zone.querySelector("input");
      var btn = zone.querySelector("button");
      var envoyerCom = function(){
        var texte = (inp.value || "").trim().slice(0, 1000);
        var actuel = ((etatAvis[String(i)] || {}).commentaire || "").trim();
        if (texte === actuel) return;
        btn.disabled = true;
        envoyer({ action: "avis", index: i, commentaire: texte }, texte ? "✓ Merci, votre commentaire a bien été transmis" : "Commentaire retiré").then(function(ok){
          btn.disabled = false;
          if (!ok) return;
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].commentaire = texte;
        });
      };
      btn.addEventListener("click", envoyerCom);
      inp.addEventListener("keydown", function(e){ if (e.key === "Enter") envoyerCom(); });
    });

    brancherBarre(d);
    brancherRdv(d);

    // Adresse : ouverture de Maps au clic sur la carte, demande d'adresse sinon
    Array.prototype.forEach.call(document.querySelectorAll(".carte"), function(el){
      el.addEventListener("click", function(){
        window.open("https://www.google.com/maps/search/?api=1&query=" + el.getAttribute("data-q"), "_blank", "noopener");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".adr-demande"), function(btn){
      btn.addEventListener("click", function(){
        var i = parseInt(btn.getAttribute("data-adr"), 10);
        envoyer({ action: "adresse", index: i }, "✓ Demande transmise — votre conseiller vous donne l'adresse très vite").then(function(ok){
          if (!ok) return;
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].adresse_demandee = true;
          btn.disabled = true;
          btn.textContent = "✓ Adresse demandée — votre conseiller revient vers vous";
        });
      });
    });

    // Comparateur
    var compInvite = document.getElementById("comp-ouvrir");
    if (compInvite) compInvite.addEventListener("click", ouvrirComp);
    document.getElementById("btn-comp").addEventListener("click", ouvrirComp);
    document.getElementById("comp-x").addEventListener("click", fermerComp);
    document.getElementById("comp").addEventListener("click", function(e){ if (e.target === this) fermerComp(); });

    // Lightbox
    document.getElementById("lb-x").addEventListener("click", fermerLb);
    document.getElementById("lb-prec").addEventListener("click", function(){ lbIdx--; majLb(); });
    document.getElementById("lb-suiv").addEventListener("click", function(){ lbIdx++; majLb(); });
    document.getElementById("lb").addEventListener("click", function(e){ if (e.target === this) fermerLb(); });
    document.addEventListener("keydown", function(e){
      if (document.getElementById("lb").classList.contains("show")){
        if (e.key === "Escape") fermerLb();
        if (e.key === "ArrowLeft"){ lbIdx--; majLb(); }
        if (e.key === "ArrowRight"){ lbIdx++; majLb(); }
      } else if (document.getElementById("comp").classList.contains("show") && e.key === "Escape") fermerComp();
    });
    (function(){
      var lb = document.getElementById("lb"), x0 = null;
      lb.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40){ lbIdx += (dx < 0 ? 1 : -1); majLb(); }
        x0 = null;
      }, { passive: true });
    })();

    // Partage
    document.getElementById("btn-partage").addEventListener("click", function(){
      var url = location.href;
      if (navigator.share){
        navigator.share({ title: "Ma sélection GLR Immobilier", url: url }).catch(function(){});
      } else if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ toast("✓ Lien copié — partagez-le à qui vous voulez"); });
      } else {
        toast(url);
      }
    });
  }

  // ---------- Chargement ----------
  if (token === "demo"){ rendre(donneesDemo()); return; }

  if (apercu){
    var bandeau = document.createElement("div");
    bandeau.style.cssText = "position:fixed;top:0;left:0;right:0;background:#1a1d23;color:#c8a96e;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:7px 10px;z-index:100";
    bandeau.textContent = "Aperçu conseiller — cette visite n'est pas comptée, les clics ne sont pas transmis";
    document.body.appendChild(bandeau);
    document.body.style.paddingTop = "30px";
  }

  fetch(FN + "?data=1" + (apercu ? "&apercu=1" : ""))
  .then(function(r){
    if (r.status === 404) throw { code: 404 };
    if (!r.ok) throw {};
    return r.json();
  })
  .then(function(d){
    if (!d || !d.ok) throw { code: 404 };
    if (d.expired){
      ecranVide("Cette sélection a expiré",
        "Pour recevoir une sélection à jour des meilleures opportunités du moment, contactez " + (d.vendeur || "votre conseiller") + " — GLR Immobilier. Les prix et disponibilités évoluent vite !");
      return;
    }
    rendre(d);
  })
  .catch(function(e){
    if (e && e.code === 404) ecranVide("Lien introuvable", "Ce lien de sélection n'existe pas ou a expiré. Rapprochez-vous de votre conseiller GLR Immobilier.");
    else ecranVide("Erreur de chargement", "Impossible de charger votre sélection — vérifiez votre connexion et réessayez.");
  });
})();
</script>

<script>
/* ============ MISE À JOUR SILENCIEUSE DE LA PAGE SÉLECTION ============
   Surveille l'empreinte (ETag) du fichier servi par GitHub Pages. Quand
   une nouvelle version est en ligne, la page ne se recharge QUE lorsque
   le client a quitté l'onglet — jamais pendant qu'il lit. La position de
   lecture est restaurée à son retour. Aucun message technique affiché.
   ===================================================================== */
(function () {
  'use strict';

  var INTERVALLE      = 90000;
  var INTERVALLE_CONF = 8000;
  var CLE_SCROLL = 'glr-sel-scroll';
  var URL_PAGE = location.pathname;

  try {
    var brut = sessionStorage.getItem(CLE_SCROLL);
    if (brut) {
      sessionStorage.removeItem(CLE_SCROLL);
      var sauve = JSON.parse(brut);
      if (sauve && sauve.y > 0 && Date.now() - sauve.t < 7200000) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var essais = 0;
        var rendu = setInterval(function () {
          if (++essais > 40) { clearInterval(rendu); return; }
          var hauteur = document.documentElement.scrollHeight;
          if (hauteur >= sauve.y + window.innerHeight * 0.5) {
            window.scrollTo(0, sauve.y);
            if (Math.abs(window.pageYOffset - sauve.y) < 4) clearInterval(rendu);
          }
        }, 200);
      }
    }
  } catch (e) {}

  var reference = null, candidat = null, prete = false, timer = null;

  function empreinte(r) {
    return r.headers.get('ETag') || r.headers.get('Last-Modified') || null;
  }

  function programmer(delai) { clearTimeout(timer); timer = setTimeout(verifier, delai); }

  function verifier() {
    if (prete) return;
    if (navigator.onLine === false) { programmer(INTERVALLE); return; }
    fetch(URL_PAGE + '?_maj=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { programmer(INTERVALLE); return; }
        var e = empreinte(r);
        if (!e) { console.log('[MAJ] en-tete ETag indisponible - surveillance inactive'); return; }
        if (reference === null) { reference = e; console.log('[MAJ] surveillance active'); programmer(INTERVALLE); return; }
        if (e === reference)    { candidat = null; programmer(INTERVALLE); return; }
        if (e === candidat)     { prete = true; if (document.hidden) recharger(); return; }
        candidat = e; programmer(INTERVALLE_CONF);
      })
      .catch(function () { programmer(INTERVALLE); });
  }

  function recharger() {
    try {
      sessionStorage.setItem(CLE_SCROLL, JSON.stringify({ y: window.pageYOffset || 0, t: Date.now() }));
    } catch (e) {}
    location.reload();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && prete) recharger();
  });

  programmer(5000);
})();
</script>
