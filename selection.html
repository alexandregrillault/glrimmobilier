<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votre sélection — GLR Immobilier</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --gold:#c8a96e; --gold-fonce:#b3945a; --dark:#1a1d23; --muted:#6b7280;
    --bg:#f7f5f1; --carte:#ffffff; --bordure:#e8e3d9; --encre:#3f4550;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--dark); font-family:'Helvetica Neue',Arial,sans-serif; line-height:1.55; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 18px 110px; }

  header { text-align:center; padding:22px 0 18px; }
  .marque { font-family:Georgia,'Times New Roman',serif; letter-spacing:5px; font-size:18px; font-weight:700; }
  .logo { display:block; height:72px; width:auto; max-width:80%; margin:0 auto; }
  .filet { width:54px; height:2px; background:var(--gold); margin:14px auto 0; }

  .intro { background:var(--carte); border:1px solid var(--bordure); border-radius:16px; padding:24px 26px; margin:18px 0 10px; box-shadow:0 2px 12px rgba(26,29,35,.05); }
  .intro h1 { font-family:Georgia,serif; font-size:22px; margin-bottom:8px; font-weight:600; }
  .intro p { color:var(--encre); font-size:15px; white-space:pre-line; }
  .intro .sig { margin-top:14px; color:var(--muted); font-size:13px; font-style:italic; }

  .meta { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:14px 0 22px; }
  .meta span::before { content:""; }

  /* ---- Carte bien ---- */
  .card { background:var(--carte); border:1px solid var(--bordure); border-radius:16px; overflow:hidden; margin-bottom:28px; box-shadow:0 2px 12px rgba(26,29,35,.05);
          opacity:0; transform:translateY(18px); transition:opacity .5s ease, transform .5s ease; }
  .card.vue { opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce){ .card { opacity:1; transform:none; transition:none; } }

  .photo { position:relative; height:250px; background:#eceae4; overflow:hidden; user-select:none; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  /* Le plan du lot : fond blanc et image entière, jamais recadrée par le
     navigateur — un plan tronqué ne veut plus rien dire. */
  .photo.plan { background:#fff; border-bottom:1px solid var(--bordure); height:300px; }
  .photo.plan img { object-fit:contain; padding:12px; box-sizing:border-box; }
  .voir-plan { position:absolute; right:12px; bottom:12px; z-index:3; display:flex; align-items:center; gap:6px;
    background:rgba(26,29,35,.82); color:#fff; font-size:11.5px; letter-spacing:.3px; padding:5px 12px; border-radius:16px;
    pointer-events:none; transition:opacity .2s; }
  .photo.plan:hover .voir-plan { background:rgba(26,29,35,.94); }
  .img-vide { position:relative; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a1d23,#3a3f4a); height:250px; }
  .img-vide img { max-width:150px; max-height:120px; object-fit:contain; }
  .img-vide .txt { color:var(--gold); font-family:Georgia,serif; letter-spacing:6px; font-size:22px; }
  .num-bien { position:absolute; top:12px; left:12px; background:var(--gold); color:#fff; font-family:Georgia,serif; font-size:12.5px; padding:3px 11px; border-radius:14px; letter-spacing:1px; z-index:3; }

  .body { padding:22px 24px 24px; }
  .eyebrow { color:var(--gold-fonce); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; margin-bottom:4px; }
  h2 { font-family:Georgia,serif; font-size:21px; margin-bottom:4px; font-weight:600; }
  .prix { font-family:Georgia,serif; font-size:22px; font-weight:700; color:var(--encre); margin-bottom:10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { border:1px solid #e0d9c8; background:#faf8f4; border-radius:20px; padding:2px 11px; font-size:12px; color:#4a4f58; }
  .pitch { font-size:14px; color:var(--encre); margin-bottom:10px; }
  .atouts { list-style:none; margin:0 0 12px; font-size:13.5px; color:var(--encre); }
  .atouts li { padding-left:20px; position:relative; margin-bottom:3px; }
  .atouts li::before { content:"✦"; position:absolute; left:2px; color:var(--gold); font-size:11px; }

  .det { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px 14px; margin:12px 0; padding:13px 15px; background:#faf8f4; border:1px solid #eee8db; border-radius:12px; }
  .det span { display:block; font-size:10px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
  .det strong { font-size:13.5px; }

  /* Prix selon le régime de TVA */
  .prix-blocs { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px; }
  .prix-bloc { flex:0 1 auto; min-width:0; border:1px solid #e0d9c8; border-radius:12px; padding:9px 14px; background:#faf8f4; }
  .prix-bloc.avantage { border-color:var(--gold); background:#fdfaf3; box-shadow:0 1px 6px rgba(200,169,110,.18); }
  .prix-bloc .regime { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .prix-bloc.avantage .regime { color:var(--gold); font-weight:700; }
  .prix-bloc .montant { font-family:Georgia,serif; font-size:20px; font-weight:700; color:var(--encre); }
  .prix-bloc .detail { font-size:11.5px; color:var(--muted); margin-top:3px; }
  /* Ville : intertitre quand la sélection couvre plusieurs communes */
  .ville-titre { display:flex; align-items:center; gap:12px; margin:38px 0 16px; padding-bottom:9px; border-bottom:2px solid var(--gold); scroll-margin-top:14px; }
  .ville-titre .ville-nom { font-family:Georgia,'Times New Roman',serif; font-size:23px; font-weight:700; color:var(--dark); letter-spacing:.2px; }
  .ville-titre .ville-cp { font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; font-weight:400; color:var(--muted); margin-left:7px; letter-spacing:.5px; }
  .ville-titre .ville-nb { margin-left:auto; background:var(--gold); color:#fff; border-radius:20px; padding:4px 13px; font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; }
  .ville-titre:first-of-type { margin-top:6px; }

  /* Sélection enrichie depuis la dernière visite du client */
  .maj-bandeau { display:flex; align-items:center; gap:11px; background:linear-gradient(180deg,#fdfaf3,#fbf6ea); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:12px; padding:12px 15px; margin:16px 0 4px; box-shadow:0 2px 8px rgba(200,169,110,.16); }
  .maj-bandeau b { font-family:Georgia,serif; font-size:14.5px; color:var(--dark); }
  .maj-bandeau span { font-size:13px; color:var(--muted); }
  .card .num-neuf { position:absolute; top:12px; right:12px; background:#fff; color:var(--gold-fonce); border:1px solid var(--gold); font-size:11px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; padding:3px 11px; border-radius:14px; z-index:3; box-shadow:0 2px 8px rgba(26,29,35,.12); }

  /* Villes en tête de sélection : un raccourci vers chaque commune */
  .villes-tete { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px; }
  .ville-chip { display:flex; align-items:baseline; gap:7px; background:#fff; border:1px solid var(--gold); border-radius:22px; padding:7px 15px; text-decoration:none; transition:all .15s; }
  .ville-chip b { font-family:Georgia,serif; font-size:14px; font-weight:600; color:var(--dark); }
  .ville-chip span { font-size:12px; color:var(--gold-fonce); font-weight:600; }
  .ville-chip:hover { background:var(--gold); box-shadow:0 2px 8px rgba(200,169,110,.3); }
  .ville-chip:hover b, .ville-chip:hover span { color:#fff; }

  /* Adresse du lot + carte */
  .adresse { display:flex; align-items:flex-start; gap:7px; font-size:13.5px; color:var(--encre); margin:12px 0 8px; }
  .adresse svg { flex:none; margin-top:1px; }
  .carte { position:relative; height:150px; border-radius:12px; overflow:hidden; border:1px solid var(--bordure); background:#eceae4; cursor:pointer; }
  .carte-tuiles { position:absolute; inset:0; }
  .carte-tuiles img { position:absolute; border:0; }
  .carte .pin { position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-30px 0 0 -11px; opacity:0; }
  .carte.vue .pin { animation:tombe .55s cubic-bezier(.3,1.4,.5,1) .15s forwards; }
  @keyframes tombe { 0% { opacity:0; transform:translateY(-26px) scale(.85); } 60% { opacity:1; transform:translateY(2px) scale(1); } 100% { opacity:1; transform:translateY(0) scale(1); } }
  .carte-credits { position:absolute; right:0; bottom:0; background:rgba(255,255,255,.82); color:#5a606b; font-size:9.5px; padding:1px 5px; border-radius:5px 0 0 0; }
  .adr-btns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
  .adr-btn { border:1px solid var(--bordure); background:#fff; color:var(--encre); border-radius:10px; padding:7px 13px; font-size:12.5px; font-weight:600; text-decoration:none; transition:all .15s; }
  .adr-btn:hover { border-color:var(--gold); color:var(--gold-fonce); }
  .adr-demande { border:1px dashed var(--gold); background:#fffdf8; color:var(--gold-fonce); border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; margin:10px 0 2px; }
  .adr-demande:hover { background:var(--gold); color:#fff; border-style:solid; }
  .adr-demande[disabled] { opacity:.75; cursor:default; border-style:solid; }

  /* Offres commerciales négociées par le conseiller */
  .remises { display:flex; flex-direction:column; gap:7px; margin:2px 0 14px; }
  .remise { display:flex; align-items:center; gap:11px; background:linear-gradient(180deg,#fdfaf3,#fbf6ea); border:1px solid var(--gold); border-left:4px solid var(--gold); border-radius:12px; padding:10px 14px; box-shadow:0 2px 8px rgba(200,169,110,.16); }
  .remise .offre-tag { font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:#fff; background:var(--gold); border-radius:4px; padding:3px 7px; white-space:nowrap; }
  .remise .offre-txt { font-size:13.5px; font-weight:600; color:var(--dark); }
  .remise .offre-montant { margin-left:auto; font-family:Georgia,serif; font-size:17px; font-weight:700; color:var(--gold-fonce); white-space:nowrap; }
  /* Le mot du conseiller sous un lot */
  .mot { background:#fff; border:1px solid var(--bordure); border-left:4px solid var(--gold); border-radius:12px; padding:11px 14px; margin:2px 0 14px; }
  .mot-qui { font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:700; color:var(--gold-fonce); margin-bottom:4px; }
  .mot-txt { font-size:14px; line-height:1.5; color:var(--dark); white-space:pre-wrap; }

  .prix-eco { display:inline-block; margin-top:6px; background:var(--gold); color:#fff; border-radius:20px; padding:2px 10px; font-size:11.5px; font-weight:700; }
  .prix-lois { font-size:11.5px; color:var(--muted); margin-top:2px; }

  /* Faits marquants du lot */
  .faits { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px; }
  .fait { border:1px solid #e0d9c8; border-radius:10px; padding:6px 11px; background:#fff; font-size:12.5px; }
  .fait b { display:block; font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:1px; }
  .annexes-lot { font-size:12.5px; color:var(--encre); margin-top:8px; }
  .annexes-lot span { display:inline-block; border:1px dashed var(--gold); border-radius:20px; padding:3px 11px; margin:3px 5px 0 0; }

  .docs { margin:14px 0 2px; }
  .doc { display:block; width:100%; box-sizing:border-box; border:none; background:var(--gold); color:#fff; border-radius:12px; padding:14px; font-size:15px; font-weight:700; letter-spacing:.3px; text-align:center; text-decoration:none; transition:background .15s; box-shadow:0 3px 10px rgba(200,169,110,.35); }
  .doc:hover { background:var(--gold-fonce); color:#fff; }

  .comp-invite { background:#fff; border:1px solid var(--gold); border-radius:16px; padding:22px 24px; margin:2px 0 22px; text-align:center; box-shadow:0 2px 10px rgba(200,169,110,.15); }
  .comp-invite h3 { font-family:Georgia,serif; font-size:18px; font-weight:600; margin-bottom:6px; }
  .comp-invite p { font-size:13.5px; color:var(--muted); margin-bottom:14px; }
  .comp-invite button { border:none; background:var(--gold); color:#fff; border-radius:12px; padding:13px 26px; font-size:14.5px; font-weight:700; cursor:pointer; transition:background .15s; }
  .comp-invite button:hover { background:var(--gold-fonce); }

  .cta-rdv { width:100%; margin-top:14px; border:none; background:var(--gold); color:#fff; border-radius:12px; padding:14px; font-size:15px; font-weight:700; letter-spacing:.3px; cursor:pointer; transition:background .15s; box-shadow:0 3px 10px rgba(200,169,110,.35); }
  .cta-rdv:hover { background:var(--gold-fonce); }

  .avis { border-top:1px dashed #e0d9c8; margin-top:16px; padding-top:14px; }
  .avis-titre { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .avis-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .ab { border:1px solid #ddd6c8; background:#faf8f4; border-radius:22px; padding:8px 14px; font-size:13.5px; cursor:pointer; transition:all .15s; }
  .ab:hover { border-color:var(--gold); }
  .ab.on { background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600; }

  /* ---- Bloc rendez-vous ---- */
  .rdv { background:var(--dark); border-radius:16px; padding:26px 26px 24px; margin:6px 0 28px; text-align:center; color:#fff; }
  .rdv h3 { font-family:Georgia,serif; font-size:19px; font-weight:600; margin-bottom:6px; }
  .rdv p { font-size:13.5px; color:#c8cbd2; margin-bottom:14px; }
  .rdv-form { display:flex; gap:8px; max-width:440px; margin:0 auto; }
  .rdv-form input { flex:1; min-width:0; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); border-radius:10px; padding:10px 13px; font-size:13.5px; color:#fff; outline:none; }
  .rdv-form input::placeholder { color:#9aa0ab; }
  .rdv-form input:focus { border-color:var(--gold); }
  .rdv-btn { border:none; background:var(--gold); color:#fff; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .rdv-btn:hover { background:var(--gold-fonce); }
  .rdv-ok { font-size:14px; color:var(--gold); font-weight:600; }
  .cren-jours { display:flex; flex-direction:column; gap:12px; max-width:520px; margin:0 auto; text-align:left; }
  .cren-jour-t { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#9aa0ab; margin-bottom:6px; }
  .cren-pick { max-width:520px; margin:0 auto; }
  .cren-etape { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#9aa0ab; margin:14px 0 8px; text-align:left; }
  .cren-jrow { display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .cren-jpill { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06); color:#fff; border-radius:12px; padding:8px 14px; cursor:pointer; transition:all .15s; }
  .cren-jpill:hover { border-color:var(--gold); }
  .cren-jpill-wd { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#9aa0ab; }
  .cren-jpill-dm { font-size:14px; font-weight:700; }
  .cren-jpill.on { background:var(--gold); border-color:var(--gold); }
  .cren-jpill.on .cren-jpill-wd { color:rgba(255,255,255,.85); }
  .cren-heures { justify-content:flex-start; }
  .cren-liste { display:flex; gap:7px; flex-wrap:wrap; }
  .cren { border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08); color:#fff; border-radius:10px; padding:9px 15px; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; }
  .cren:hover { border-color:var(--gold); background:var(--gold); }
  .cren.off { opacity:.35; cursor:not-allowed; }
  .cren-autre { margin-top:16px; }
  .cren-autre button { background:none; border:none; color:#9aa0ab; font-size:13px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .cren-autre button:hover { color:var(--gold); }
  .rdv-mode { font-size:12.5px; color:#9aa0ab; margin-top:12px; }
  .rdv-lots { display:inline-block; border:1px solid rgba(200,169,110,.5); border-radius:22px; padding:6px 16px; font-size:13px; color:var(--gold); margin-bottom:14px; font-weight:600; }
  /* Deux formats : la visio de 30 min, ou l'appel de 10 min */
  .fmt-choix { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:520px; margin:0 auto 14px; }
  .fmt { text-align:left; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06); color:#fff; border-radius:14px; padding:13px 14px; cursor:pointer; transition:all .15s; font-family:inherit; }
  .fmt:hover { border-color:var(--gold); }
  .fmt.on { border-color:var(--gold); background:rgba(200,169,110,.16); box-shadow:0 0 0 1px var(--gold) inset; }
  .fmt-titre { font-family:Georgia,serif; font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .fmt-duree { font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; font-weight:700; color:#fff; background:var(--gold); border-radius:5px; padding:2px 7px; }
  .fmt-sous { font-size:12.5px; color:#c8cbd2; margin-top:6px; line-height:1.45; }
  .fmt-mode { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--gold); margin-top:8px; font-weight:700; }
  .fmt-vide { font-size:13px; color:#c8cbd2; margin:8px 0 4px; }
  @media (max-width:560px){ .fmt-choix { grid-template-columns:1fr; } }

  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:8px; }
  .partage { margin-top:12px; }
  .partage button { border:1px solid #ddd6c8; background:#fff; border-radius:20px; padding:7px 16px; font-size:12.5px; color:var(--encre); cursor:pointer; }
  .partage button:hover { border-color:var(--gold); }

  /* ---- Barre de progression sticky ---- */
  #barre { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--bordure);
           padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:40; transform:translateY(110%); transition:transform .3s ease; }
  #barre.show { transform:none; }
  .barre-in { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .prog { flex:1; min-width:0; }
  .prog-txt { font-size:12px; color:var(--muted); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prog-fond { height:5px; background:#ece7dc; border-radius:3px; overflow:hidden; }
  .prog-rempli { height:100%; width:0; background:var(--gold); border-radius:3px; transition:width .4s ease; }
  .barre-btn { border:1px solid var(--dark); background:var(--dark); color:#fff; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .barre-btn.sec { background:#fff; color:var(--dark); }

  /* ---- Comparateur ---- */
  #comp { position:fixed; inset:0; background:rgba(26,29,35,.6); z-index:60; display:none; align-items:center; justify-content:center; padding:18px; }
  #comp.show { display:flex; }
  .comp-boite { background:#fff; border-radius:16px; max-width:860px; width:100%; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .comp-tete { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--bordure); }
  .comp-tete h3 { font-family:Georgia,serif; font-size:17px; font-weight:600; }
  .comp-x { border:none; background:none; font-size:20px; cursor:pointer; color:var(--muted); padding:4px 8px; }
  .comp-scroll { overflow:auto; }
  .comp-scroll table { border-collapse:collapse; width:100%; min-width:520px; }
  .comp-scroll th, .comp-scroll td { padding:10px 14px; font-size:13px; text-align:left; border-bottom:1px solid #f0ece3; vertical-align:top; }
  .comp-scroll thead th { font-family:Georgia,serif; font-size:13.5px; background:#faf8f4; position:sticky; top:0; }
  .comp-scroll td:first-child, .comp-scroll th:first-child { color:var(--muted); font-size:11px; letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; position:sticky; left:0; background:#fff; }
  .comp-scroll thead th:first-child { background:#faf8f4; }

  /* ---- Lightbox ---- */
  #lb { position:fixed; inset:0; background:rgba(15,17,21,.94); z-index:70; display:none; align-items:center; justify-content:center; }
  #lb.show { display:flex; }
  #lb img { max-width:94vw; max-height:88vh; object-fit:contain; border-radius:6px; }
  #lb img.plan { background:#fff; padding:10px; }
  #lb .lb-ouvrir { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:3;

<script>
(function(){
  var SUPA = "https://hydqfbxdtpmbuooexekp.supabase.co";
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var apercu = params.get("apercu") === "1"; // mode conseiller : rien n'est compté ni transmis
  var FN = SUPA + "/functions/v1/selection/" + encodeURIComponent(token);
  var cont = document.getElementById("contenu");
  var etatAvis = {};   // copie locale des avis
  var biens = [];
  var rdvContexte = ""; // bien depuis lequel le client a cliqué "Demander un rendez-vous"
  // Deux formats (choix d'Alex, septembre 2026), les mêmes que sur le mail de
  // rendez-vous : la visio de 30 min, ou l'appel de 10 min. Des durées courtes,
  // volontairement : un gros créneau fait peur au client. Il ne bloque que
  // cette durée dans l'agenda du conseiller.
  var FORMATS = {
    visio: { duree:30, mode:"visio",     titre:"Visio",           sous:"On prend le temps de vous montrer : les biens retenus, les programmes, comment se passe un achat dans le neuf, votre financement, et d'autres lots qui pourraient vous plaire.", modeLbl:"En visio, 30 minutes" },
    appel: { duree:10, mode:"telephone", titre:"Premier échange", sous:"Vous avez moins de temps ? Dix minutes par téléphone suffisent pour une première esquisse : vos coups de cœur, votre projet, et les pistes à creuser.", modeLbl:"Par téléphone, 10 minutes" }
  };
  // Les disponibilités du conseiller sont découpées en créneaux de 10 min ; pour
  // ne pas noyer le client sous les horaires, on ne lui montre que les heures
  // rondes (toutes les 30 min) — plus le premier horaire libre après un
  // rendez-vous déjà pris (9h10, par exemple), pour ne pas laisser de temps mort.
  var GRILLE_MIN = 30;
  function horairesMontres(liste){
    var finsLibres = {};
    (liste || []).forEach(function(c){ finsLibres[new Date(c.fin).getTime()] = true; });
    return (liste || []).filter(function(c){
      var d = new Date(c.debut);
      return (d.getMinutes() % GRILLE_MIN) === 0 || !finsLibres[d.getTime()];
    });
  }
  var formatChoisi = "visio";
  var modeContact = FORMATS[formatChoisi].mode;
  var lbBien = 0, lbIdx = 0;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toast(m){
    var t = document.getElementById("toast");
    t.textContent = m; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  // Demande au client de relire son créneau avant de l'engager. Répond une
  // promesse : true s'il confirme, false s'il annule ou ferme la boîte.
  function demanderConfirmation(o){
    return new Promise(function(resoudre){
      var fond = document.getElementById("confirm");
      var oui = document.getElementById("cf-oui");
      var non = document.getElementById("cf-non");
      if (!fond || !oui || !non) { resoudre(true); return; }
      document.getElementById("cf-titre").textContent = o.titre || "On confirme ?";
      document.getElementById("cf-quand").textContent = o.quand || "";
      document.getElementById("cf-comment").textContent = o.comment || "";
      oui.textContent = o.ok || "Confirmer";
      fond.classList.add("show");
      setTimeout(function(){ oui.focus(); }, 40);
      function fermer(reponse){
        fond.classList.remove("show");
        oui.onclick = null; non.onclick = null; fond.onclick = null;
        document.removeEventListener("keydown", touche);
        resoudre(reponse);
      }
      function touche(e){ if (e.key === "Escape") fermer(false); }
      oui.onclick = function(){ fermer(true); };
      non.onclick = function(){ fermer(false); };
      fond.onclick = function(e){ if (e.target === fond) fermer(false); };
      document.addEventListener("keydown", touche);
    });
  }
  function envoyer(corps, message){
    if (apercu){ toast("Mode aperçu conseiller — aucune action n'est transmise"); return Promise.resolve(false); }
    return fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corps) })
      .then(function(r){ if (!r.ok) throw 0; if (message) toast(message); return true; })
      .catch(function(){ toast("Envoi impossible — vérifiez votre connexion et réessayez"); return false; });
  }
  // ---------- Temps de lecture : total et répartition par bien ----------
  // Une seconde comptée par seconde réellement visible ; le bien crédité est
  // celui dont la carte occupe le centre de l'écran.
  var tpsTotal = 0, tpsBiens = {};
  function bienAuCentre(){
    var cartes = document.querySelectorAll("[data-carte]");
    var milieu = window.innerHeight / 2, choisi = null, ecart = Infinity;
    for (var k = 0; k < cartes.length; k++){
      var r = cartes[k].getBoundingClientRect();
      if (r.bottom < 60 || r.top > window.innerHeight - 60) continue;
      var e = Math.abs((r.top + r.bottom) / 2 - milieu);
      if (e < ecart){ ecart = e; choisi = cartes[k].getAttribute("data-carte"); }
    }
    return choisi;
  }
  function tpsBattement(){
    if (document.hidden) return;
    tpsTotal++;
    var i = bienAuCentre();
    if (i !== null) tpsBiens[i] = (tpsBiens[i] || 0) + 1;
  }
  function tpsEnvoi(fermeture){
    if (apercu || !tpsTotal) return;
    var corps = JSON.stringify({ action: "temps", total: tpsTotal, biens: tpsBiens });
    tpsTotal = 0; tpsBiens = {};
    // Onglet qui se ferme : sendBeacon en text/plain (pas de prévol CORS, l'envoi survit)
    if (fermeture && navigator.sendBeacon){
      try { if (navigator.sendBeacon(FN, new Blob([corps], { type: "text/plain;charset=UTF-8" }))) return; } catch(e){}
    }
    fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: corps, keepalive: !!fermeture }).catch(function(){});
  }
  function tpsDemarrer(){
    if (apercu) return;
    setInterval(tpsBattement, 1000);
    setInterval(function(){ tpsEnvoi(false); }, 20000);
    document.addEventListener("visibilitychange", function(){ if (document.hidden) tpsEnvoi(true); });
    window.addEventListener("pagehide", function(){ tpsEnvoi(true); });
  }

  // ---------- Créneaux de rendez-vous ----------
  var MODES_RDV = { visio: "en visio", agence: "à l'agence", sur_place: "sur place", telephone: "par téléphone" };
  // « en visio · 45 min » à partir de l'état du rendez-vous (durée réelle, sinon format)
  function libelleRdv(e){
    var d = e && e.duree;
    if (!d && e && e.debut && e.fin) d = Math.round((new Date(e.fin) - new Date(e.debut)) / 60000);
    if (!d && e && FORMATS[e.format]) d = FORMATS[e.format].duree;
    var m = MODES_RDV[e && e.mode] || "";
    return m + (d ? " · " + d + " min" : "");
  }
  // Ne garder que les créneaux où la durée du format choisi tient d'affilée
  function creneauxDuFormat(liste){
    var besoin = FORMATS[formatChoisi].duree;
    return horairesMontres((liste || []).filter(function(c){
      var max = c.duree_max != null ? c.duree_max : Math.round((new Date(c.fin) - new Date(c.debut)) / 60000);
      return max >= besoin;
    }));
  }
  function fmtJourLong(iso){
    var dt = new Date(iso);
    if (isNaN(dt)) return "";
    var t = dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function fmtHeure(iso){
    var dt = new Date(iso);
    return isNaN(dt) ? "" : dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  // Lots que le client a marqués comme intéressants : le rendez-vous devient obligatoire
  function lotsInteresses(){
    var out = [];
    for (var i = 0; i < biens.length; i++){
      var a = etatAvis[String(i)] || {};
      if (a.choix === "interesse") out.push(biens[i] && biens[i].titre ? biens[i].titre : "Bien " + (i + 1));
    }
    return out;
  }

  // Choix en deux temps, façon Doctolib : d'abord le jour, puis l'heure
  function htmlCreneaux(liste, action){
    var jours = {}, ordre = [];
    liste.forEach(function(c){
      var k = String(c.debut).slice(0, 10);
      if (!jours[k]){ jours[k] = []; ordre.push(k); }
      jours[k].push(c);
    });
    ordre.sort();
    ordre = ordre.slice(0, 21);
    if (!ordre.length) return "";
    var h = "<div class='cren-pick'>";
    // 1. Les jours disponibles
    h += "<div class='cren-etape'>1. Choisissez un jour</div><div class='cren-jrow'>";
    ordre.forEach(function(k, i){
      var dt = new Date(jours[k][0].debut);
      var wd = dt.toLocaleDateString("fr-FR", { weekday: "short" });
      var dm = dt.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      h += "<button type='button' class='cren-jpill" + (i === 0 ? " on" : "") + "' data-jour='" + esc(k) + "'>"
         + "<span class='cren-jpill-wd'>" + esc(wd) + "</span><span class='cren-jpill-dm'>" + esc(dm) + "</span></button>";
    });
    h += "</div>";
    // 2. Les heures du jour choisi (les autres jours restent en mémoire, masqués)
    h += "<div class='cren-etape'>2. Choisissez une heure</div>";
    ordre.forEach(function(k, i){
      h += "<div class='cren-liste cren-heures' data-jour='" + esc(k) + "'" + (i === 0 ? "" : " style='display:none'") + ">";
      jours[k].forEach(function(c){
        h += "<button class='cren' data-id='" + esc(c.id) + "' data-action='" + action + "' data-debut='" + esc(c.debut) + "'>" + esc(fmtHeure(c.debut)) + "</button>";
      });
      h += "</div>";
    });
    return h + "</div>";
  }

  function htmlModes(){
    var h = "<div class='fmt-choix'>";
    ["visio", "appel"].forEach(function(k){
      var f = FORMATS[k];
      h += "<button type='button' class='fmt" + (formatChoisi === k ? " on" : "") + "' data-format='" + k + "' aria-pressed='" + (formatChoisi === k) + "'>"
         + "<div class='fmt-titre'>" + esc(f.titre) + " <span class='fmt-duree'>" + f.duree + " min</span></div>"
         + "<div class='fmt-sous'>" + esc(f.sous) + "</div>"
         + "<div class='fmt-mode'>" + esc(f.modeLbl) + "</div>"
         + "</button>";
    });
    return h + "</div>";
  }

  function htmlRdv(d){
    var rdv = etatAvis.rdv || {};
    var qui = d.vendeur ? esc(d.vendeur) : "votre conseiller";
    var h = "";

    // Rendez-vous déjà posé
    if (rdv.reserve && rdv.debut && !rdv.refuse){
      var confirme = !!rdv.confirme;
      h += "<h3>" + (confirme ? "Votre rendez-vous est confirmé" : "Votre créneau est réservé") + "</h3>";
      h += confirme
        ? "<p>À très vite avec " + qui + ".</p>"
        : "<p>" + qui + " vous confirme le rendez-vous très vite.</p>";
      h += "<div class='rdv-ok'>" + esc(fmtJourLong(rdv.debut)) + " à " + esc(fmtHeure(rdv.debut)) + "</div>";
      h += "<div class='rdv-mode'>" + (confirme ? "\u2713 Confirmé · " : "En attente de confirmation · ") + esc(libelleRdv(rdv)) + (rdv.lieu ? " — " + esc(rdv.lieu) : "") + "</div>";
      return h;
    }

    // Le conseiller a proposé d'autres créneaux : le client tranche, c'est confirmé d'office
    var props = Array.isArray(d.propositions) ? d.propositions : [];
    if (props.length){
      h += "<h3>" + qui + " vous propose ces créneaux</h3>";
      h += "<p>Le créneau que vous aviez choisi n'était finalement pas disponible. Choisissez celui qui vous arrange : il sera confirmé immédiatement.</p>";
      h += htmlModes();
      var prf = creneauxDuFormat(props);
      if (!prf.length) h += "<div class='fmt-vide'>Aucun de ces créneaux ne tient en " + FORMATS[formatChoisi].duree + " min — essayez l'autre format.</div>";
      h += htmlCreneaux(prf, "accepter_proposition");
      return h;
    }

    var lots = lotsInteresses();
    var cr = Array.isArray(d.creneaux) ? d.creneaux : [];

    if (rdv.refuse){
      h += "<h3>Choisissez un autre créneau</h3>";
      h += "<p>Le créneau retenu n'a finalement pas pu être conservé. " + qui + " reste à votre disposition.</p>";
    } else if (lots.length){
      h += "<h3>On en parle quand vous voulez</h3>";
      h += "<div class='rdv-lots'>" + esc(lots.length > 1 ? lots.length + " lots retenus" : lots[0]) + "</div>";
      h += "<p>Choisissez le format puis le moment qui vous arrange : " + qui + " vous rappelle pour répondre à vos questions et affiner la sélection.</p>";
    } else {
      h += "<h3>Envie d'en parler ?</h3>";
      h += "<p>Choisissez le format puis le moment d'un échange avec " + qui + ", sans engagement.</p>";
    }

    h += "<div id='rdv-contexte' style='font-size:12.5px;color:var(--gold);margin-bottom:10px'></div>";
    h += htmlModes();

    if (cr.length){
      var crf = creneauxDuFormat(cr);
      if (!crf.length) h += "<div class='fmt-vide'>Aucun créneau de " + FORMATS[formatChoisi].duree + " min n'est ouvert pour le moment — essayez l'autre format, ou indiquez vos disponibilités ci-dessous.</div>";
      h += htmlCreneaux(crf, "reserver");
      h += "<div class='cren-autre'><button id='rdv-basculer'>Aucun de ces créneaux ne me convient</button></div>";
      h += "<div id='rdv-libre' style='display:none;margin-top:14px'><div class='rdv-form'><input id='rdv-creneau' type='text' maxlength='300' placeholder='Ex : mardi après 18h, ou samedi matin'><button class='rdv-btn' id='rdv-envoyer'>Envoyer ma demande</button></div></div>";
    } else if (rdv.demande){
      h += "<div class='rdv-ok'>\u2713 Votre demande a bien été transmise — " + qui + " revient vers vous très vite</div>";
    } else {
      h += "<div class='rdv-form'><input id='rdv-creneau' type='text' maxlength='300' placeholder='Ex : mardi après 18h, ou samedi matin'><button class='rdv-btn' id='rdv-envoyer'>Demander un rendez-vous</button></div>";
    }
    return h;
  }

  // Prix selon le régime fiscal : le plein tarif d'abord, les régimes avantageux ensuite
  function htmlPrix(b){
    var opts = Array.isArray(b.prixOptions) ? b.prixOptions.filter(function(o){ return o && o.prixTexte; }) : [];
    if (!opts.length) return b.prix ? "<div class='prix'>" + esc(b.prix) + "</div>" : "";
    var plein = opts[0];
    return "<div class='prix-blocs'>" + opts.map(function(o, i){
      var avantage = i > 0 && o.prix < plein.prix;
      var eco = avantage ? Math.round(plein.prix - o.prix) : 0;
      var tva = String(o.tva).replace('.', ',');
      var lois = Array.isArray(o.lois) ? o.lois.filter(function(l){ return !/droit commun/i.test(l); }) : [];
      return "<div class='prix-bloc" + (avantage ? " avantage" : "") + "'>"
        + "<div class='regime'>TVA " + esc(tva) + " %</div>"
        + "<div class='montant'>" + esc(o.prixTexte) + "</div>"
        + (o.prixM2 ? "<div class='detail'>" + esc(o.prixM2) + " le m²</div>" : "")
        + (lois.length ? "<div class='prix-lois'>" + esc(lois.join(" · ")) + "</div>" : "")
        + (o.loyer ? "<div class='detail'>Loyer estimé " + esc(o.loyer) + (o.rendement ? " · " + esc(o.rendement) : "") + "</div>" : "")
        + (eco > 0 ? "<div class='prix-eco'>− " + esc(new Intl.NumberFormat('fr-FR').format(eco)) + " €</div>" : "")
        + "</div>";
    }).join("") + "</div>";
  }

  // Remises et avantages négociés, saisis à la main par le conseiller
  // (ils ne figurent pas toujours sur la fiche Otaree du lot)
  function remisesDe(b){
    return (Array.isArray(b.remises) ? b.remises : []).filter(function(r){
      return r && (String(r.libelle || "").trim() || Number(r.montant) > 0);
    });
  }
  function texteRemise(r){
    var m = Number(r.montant);
    var t = String(r.libelle || "Remise").trim() || "Remise";
    return t + (isFinite(m) && m > 0 ? " \u2212 " + new Intl.NumberFormat('fr-FR').format(Math.round(m)) + " €" : "");
  }
  function htmlRemises(b){
    var rs = remisesDe(b);
    if (!rs.length) return "";
    return "<div class='remises'>" + rs.map(function(r){
      var m = Number(r.montant);
      var libelle = String(r.libelle || "Remise").trim() || "Remise";
      var montant = isFinite(m) && m > 0 ? "\u2212 " + new Intl.NumberFormat('fr-FR').format(Math.round(m)) + " €" : "";
      return "<div class='remise'><span class='offre-tag'>Offre</span><span class='offre-txt'>" + esc(libelle) + "</span>"
        + (montant ? "<span class='offre-montant'>" + esc(montant) + "</span>" : "") + "</div>";
    }).join("") + "</div>";
  }

  // Le mot du conseiller sur ce lot (note libre saisie dans le CRM)
  function htmlNote(b, d){
    var n = String((b && b.note) || "").trim();

  // Adresse du programme : affichée seulement si elle a été confirmée
  // (fiche Otaree recoupée avec la Base Adresse Nationale, puis validée par le
  // conseiller). Sinon le client peut la demander en un clic.
  function adresseSure(b){
    var g = b && b.geo;
    return !!(b && b.adresseOk && b.adresse && g && g.lat && g.lon);
  }
  function adresseTexte(b){
    return [b.adresse, [b.codePostal, b.commune].filter(Boolean).join(" ")].filter(Boolean).join(", ") || b.ville || "";
  }
  var PIN = "<svg class='pin-svg' width='22' height='22' viewBox='0 0 24 24' fill='none'><path d='M12 22s7-6.1 7-12A7 7 0 0 0 5 10c0 5.9 7 12 7 12z' fill='%23c8a96e' stroke='%23fff' stroke-width='1.6'/><circle cx='12' cy='10' r='2.6' fill='%23fff'/></svg>";
  function htmlAdresse(b, i, a){
    if (adresseSure(b)){
      var g = b.geo, txt = adresseTexte(b);
      var q = encodeURIComponent(txt);
      var h2 = "<div class='adresse'><svg width='15' height='15' viewBox='0 0 24 24' fill='none'><path d='M12 22s7-6.1 7-12A7 7 0 0 0 5 10c0 5.9 7 12 7 12z' fill='#c8a96e'/><circle cx='12' cy='10' r='2.4' fill='#fff'/></svg><span>" + esc(txt) + "</span></div>";
      h2 += "<div class='carte' data-lat='" + g.lat + "' data-lon='" + g.lon + "' data-q='" + esc(q) + "'>";
      h2 += "<div class='carte-tuiles'></div><div class='pin'>" + PIN.replace(/%23/g, "#") + "</div>";
      h2 += "<div class='carte-credits'>&copy; OpenStreetMap</div></div>";
      h2 += "<div class='adr-btns'>";
      h2 += "<a class='adr-btn' href='https://www.google.com/maps/search/?api=1&query=" + q + "' target='_blank' rel='noopener'>Ouvrir dans Maps</a>";
      h2 += "<a class='adr-btn' href='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=" + g.lat + "," + g.lon + "' target='_blank' rel='noopener'>Vue de la rue</a>";
      h2 += "</div>";
      return h2;
    }
    var demandee = a && a.adresse_demandee;
    return "<button class='adr-demande' data-adr='" + i + "'" + (demandee ? " disabled" : "") + ">"
      + (demandee ? "\u2713 Adresse demandée — votre conseiller revient vers vous" : "Demander l'adresse exacte") + "</button>";

  // Fond de carte : tuiles OpenStreetMap positionnées pour que le lot tombe
  // pile au centre, sans bibliothèque ni clé d'API.
  function poserCartes(){
    Array.prototype.forEach.call(document.querySelectorAll(".carte"), function(el){
      var lat = parseFloat(el.getAttribute("data-lat")), lon = parseFloat(el.getAttribute("data-lon"));
      if (!isFinite(lat) || !isFinite(lon)) return;
      var w = el.clientWidth, hh = el.clientHeight;
      if (!w || !hh) return;
      if (el.getAttribute("data-l") === String(w)) return;   // déjà posée à cette largeur
      var z = 16, n = Math.pow(2, z), tuile = 256;
      var xw = (lon + 180) / 360 * n * tuile;
      var r = lat * Math.PI / 180;
      var yw = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n * tuile;
      var gauche = xw - w / 2, haut = yw - hh / 2;
      var html = "";
      for (var ty = Math.floor(haut / tuile); ty <= Math.floor((haut + hh) / tuile); ty++){
        if (ty < 0 || ty >= n) continue;
        for (var tx = Math.floor(gauche / tuile); tx <= Math.floor((gauche + w) / tuile); tx++){
          var mx = ((tx % n) + n) % n;
          html += "<img src='https://tile.openstreetmap.org/" + z + "/" + mx + "/" + ty + ".png' alt='' loading='lazy' width='256' height='256' style='left:" + Math.round(tx * tuile - gauche) + "px;top:" + Math.round(ty * tuile - haut) + "px'>";
        }
      }
      el.querySelector(".carte-tuiles").innerHTML = html;
      el.setAttribute("data-l", String(w));
      el.classList.add("vue");
    });
  }

  // Sélection sur plusieurs communes : un lot garde son numéro d'origine,
  // seuls l'ordre et les intertitres changent.
  // « Cachan 94230 » → { nom: "Cachan", cp: "94230" }
  function villeEnDeux(v){
    var t = String(v || "").trim();
    var m = t.match(/^(.*?)[\s,]*(\d{5})\s*$/);
    return m ? { nom: m[1].trim() || t, cp: m[2] } : { nom: t, cp: "" };
  }
  function grouperParVille(liste){
    var groupes = [];
    liste.forEach(function(b, i){
      var v = String((b && b.ville) || "").trim() || "Autres biens";
      var g = null;
      for (var k = 0; k < groupes.length; k++) if (groupes[k].ville === v) { g = groupes[k]; break; }
      if (!g) { g = { ville: v, items: [] }; groupes.push(g); }
      g.items.push({ b: b, i: i });
    });
    return groupes;
  }

  // Surface, étage, exposition, livraison, annexes
  function htmlFaits(b){
    var faits = [];
    if (b.surface) faits.push(["Surface", b.surface]);
    if (b.etage) faits.push(["Étage", b.etage]);
    if (b.terrasse) faits.push(["Terrasse / balcon", b.terrasse]);
    if (b.expo) faits.push(["Exposition", b.expo]);
    if (b.livraison) faits.push(["Livraison", b.livraison]);
    if (b.promoteur) faits.push(["Promoteur", b.promoteur]);
    var h = faits.length
      ? "<div class='faits'>" + faits.map(function(f){ return "<div class='fait'><b>" + esc(f[0]) + "</b>" + esc(f[1]) + "</div>"; }).join("") + "</div>"
      : "";
    var annexes = Array.isArray(b.annexes) ? b.annexes : [];
    if (!annexes.length && b.parking) annexes = [{ type: "Parking", nom: b.parking }];
    if (annexes.length){
      h += "<div class='annexes-lot'><b style='font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)'>Compris avec le lot</b><br>"
        + annexes.map(function(a){
            // « Parking » + « Parking P33 » ne doit pas donner « Parking Parking P33 »
            var nom = String(a.nom || ""), type = String(a.type || "");
            var t = (nom && type && nom.toLowerCase().indexOf(type.toLowerCase()) === 0) ? nom : [type, nom].filter(Boolean).join(" ");
            return "<span>" + esc(t || "Annexe") + (a.surface ? " · " + esc(a.surface) : "") + (a.prix ? " · " + esc(a.prix) : "") + "</span>";
          }).join("")
        + "</div>";
    }
    return h;
  }

  function photoDe(b){
    // Une seule photo générale du programme
    if (b.image) return b.image;
    if (Array.isArray(b.images) && b.images.length) return b.images[0];
    return "";
  }
  // Le plan distingue les lots entre eux, la photo du programme est la meme
  // pour tous : c'est donc le plan, recadre sur le dessin, qui fait la carte.
  function visuelDe(b){
    if (b.planImg) return { url: b.planImg, plan: true };
    var p = photoDe(b);
    if (p) return { url: p, plan: false };
    if (b.plan) return { url: b.plan, plan: true };
    return { url: "", plan: false };
  }
  function planEntier(b){ return b.plan || b.planImg || ""; }
  // La visionneuse ouvre d'abord ce que le client a sous les yeux, et le plan
  // y passe en planche complete : c'est la qu'il peut le lire en detail.
  function imagesDe(b){
    var v = visuelDe(b), pl = planEntier(b), ph = photoDe(b), l = [];
    if (v.plan && pl) l.push(pl);
    if (ph) l.push(ph);
    if (Array.isArray(b.images)) b.images.forEach(function(u){ if (u && l.indexOf(u) < 0) l.push(u); });
    if (!v.plan && pl) l.push(pl);
    return l;
  }

      var joints = Array.isArray(b.docs) && b.docs.length

        : (b.pdf ? [{ nom: "Fiche du lot", url: b.pdf }] : []);

  // ---------- Interactions ----------

      txt.textContent = "✓ Merci ! Votre avis est complet — votre conseiller revient vers vous.";

      txt.textContent = "Votre avis : " + fait + " / " + n + " bien" + (n > 1 ? "s" : "");
    }
    barre.style.width = (n ? Math.round(100 * fait / n) : 0) + "%";
  }

  // Câblage du bloc rendez-vous — rejoué à chaque fois que le bloc est redessiné
  function brancherRdv(d){
    // Visio 45 min ou appel 15 min : les horaires proposés dépendent de la durée
    Array.prototype.forEach.call(document.querySelectorAll(".fmt"), function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-format");
        if (!FORMATS[k] || k === formatChoisi) return;
        formatChoisi = k;
        modeContact = FORMATS[k].mode;
        var bloc = document.getElementById("bloc-rdv");
        var note = document.getElementById("rdv-contexte");
        var ctx = note ? note.textContent : "";
        bloc.innerHTML = htmlRdv(d);
        var note2 = document.getElementById("rdv-contexte");
        if (note2 && ctx) note2.textContent = ctx;
        brancherRdv(d);
      });
    });

    // Navigation entre les jours (sélecteur en deux temps)
    Array.prototype.forEach.call(document.querySelectorAll(".cren-jpill"), function(p){
      p.addEventListener("click", function(){
        var k = p.getAttribute("data-jour");
        Array.prototype.forEach.call(document.querySelectorAll(".cren-jpill"), function(x){ x.classList.toggle("on", x === p); });
        Array.prototype.forEach.call(document.querySelectorAll(".cren-heures"), function(x){ x.style.display = x.getAttribute("data-jour") === k ? "" : "none"; });
      });
    });

    // Choix d'un créneau : réservation classique ou acceptation d'une proposition
    Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(btn){
      btn.addEventListener("click", function(){
        if (apercu){ toast("Mode aperçu conseiller — aucune action n'est transmise"); return; }
        if (btn.classList.contains("off")) return;
        var action = btn.getAttribute("data-action") || "reserver";
        // Double confirmation : le premier appui ne réserve rien, il ouvre la
        // relecture. Le second rejoue le même clic, drapeau levé.
        if (!btn._confirme){
          demanderConfirmation({
            titre: action === "accepter_proposition" ? "Confirmer ce rendez-vous ?" : "Réserver ce créneau ?",
            quand: fmtJourLong(btn.getAttribute("data-debut")) + " à " + fmtHeure(btn.getAttribute("data-debut")),
            comment: FORMATS[formatChoisi].titre + " \u2014 " + FORMATS[formatChoisi].modeLbl.toLowerCase() + (d && d.vendeur ? " avec " + d.vendeur : ""),
            ok: action === "accepter_proposition" ? "Oui, je confirme" : "Oui, je réserve"
          }).then(function(daccord){
            if (!daccord) return;
            btn._confirme = true;
            btn.click();
            btn._confirme = false;
          });
          return;
        }
        Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.add("off"); });
        fetch(FN, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: action, creneau_id: btn.getAttribute("data-id"), mode: modeContact, format: formatChoisi, bien: rdvContexte })
        })
        .then(function(r){ return r.json().then(function(j){ return { statut: r.status, corps: j }; }); })
        .then(function(res){
          var c = res.corps && res.corps.creneau;
          if (res.corps && res.corps.ok && c){
            etatAvis.rdv = { demande: true, reserve: true, confirme: action === "accepter_proposition", refuse: false, debut: c.debut, fin: c.fin, mode: c.mode, lieu: c.lieu, format: formatChoisi };
            d.propositions = [];
            var bloc = document.getElementById("bloc-rdv");
            bloc.className = "rdv";
            bloc.innerHTML = htmlRdv(d);
            brancherRdv(d);
            toast(action === "accepter_proposition" ? "\u2713 Rendez-vous confirmé" : "\u2713 Créneau réservé — en attente de confirmation");
            return;
          }
          // Le créneau vient d'être pris : on rafraîchit la liste concernée
          if (res.corps && (res.corps.creneaux || res.corps.propositions)){
            if (res.corps.creneaux) d.creneaux = res.corps.creneaux;
            if (res.corps.propositions) d.propositions = res.corps.propositions;
            document.getElementById("bloc-rdv").innerHTML = htmlRdv(d);
            brancherRdv(d);
            toast("Ce créneau vient d'être pris — choisissez-en un autre");
            return;
          }
          Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.remove("off"); });
          toast("Réservation impossible — réessayez");
        })
        .catch(function(){
          Array.prototype.forEach.call(document.querySelectorAll(".cren"), function(b2){ b2.classList.remove("off"); });
          toast("Réservation impossible — vérifiez votre connexion");
        });
      });
    });

    var btnBasculer = document.getElementById("rdv-basculer");
    if (btnBasculer) btnBasculer.addEventListener("click", function(){
      var zone = document.getElementById("rdv-libre");
      if (!zone) return;
      zone.style.display = "block";
      btnBasculer.style.display = "none";
      var inp = document.getElementById("rdv-creneau");
      if (inp) inp.focus();
    });

    var btnRdvEnvoyer = document.getElementById("rdv-envoyer");
    if (btnRdvEnvoyer) btnRdvEnvoyer.addEventListener("click", function(){
      var creneau = (document.getElementById("rdv-creneau").value || "").trim();
      envoyer({ action: "rdv", creneau: creneau, bien: rdvContexte, mode: modeContact, format: formatChoisi }, "✓ Demande de rendez-vous transmise").then(function(ok){
        if (!ok) return;
        etatAvis.rdv = { demande: true, creneau: creneau, mode: modeContact, format: formatChoisi };
        document.getElementById("bloc-rdv").innerHTML = htmlRdv(d);
        brancherRdv(d);
      });
    });
  }

  function brancher(d){
    // Photo : clic → plein écran
    Array.prototype.forEach.call(document.querySelectorAll(".photo"), function(g){
      var i = parseInt(g.getAttribute("data-g"), 10);
      var im = g.querySelector("img");
      if (im) im.addEventListener("click", function(){ ouvrirLb(i, 0); });
    });

    // Avis
    Array.prototype.forEach.call(document.querySelectorAll(".avis"), function(bloc){
      var i = parseInt(bloc.getAttribute("data-i"), 10);
      Array.prototype.forEach.call(bloc.querySelectorAll(".ab"), function(btn){
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(bloc.querySelectorAll(".ab"), function(b2){ b2.classList.remove("on"); });
          btn.classList.add("on");
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].choix = btn.getAttribute("data-c");
          majProgression();
          var interesse = btn.getAttribute("data-c") === "interesse";
          envoyer({ action: "avis", index: i, choix: btn.getAttribute("data-c") }, "✓ Merci, votre avis a bien été transmis");
          // La carte de rendez-vous se met à jour en bas de page, sans rien imposer.
          // Nom distinct de `bloc` : un var de même nom serait remonté en tête de
          // cette fonction et écraserait le bloc d'avis utilisé juste au-dessus.
          var blocRdv = document.getElementById("bloc-rdv");
          if (blocRdv){
            if (interesse) rdvContexte = biens[i] && biens[i].titre ? biens[i].titre : "Bien " + (i + 1);
            blocRdv.innerHTML = htmlRdv(d);
            brancherRdv(d);
          }
        });
      });
      bloc.querySelector(".cta-rdv").addEventListener("click", function(){
        rdvContexte = biens[i] && biens[i].titre ? biens[i].titre : "Bien " + (i + 1);
        var cible = document.getElementById("bloc-rdv");
        var note = document.getElementById("rdv-contexte");
        if (note) note.textContent = "Au sujet de : " + rdvContexte;
        cible.scrollIntoView({ behavior: "smooth", block: "center" });
        var inp = document.getElementById("rdv-creneau");
        if (inp) setTimeout(function(){ inp.focus(); }, 500);
      });
    });

    brancherRdv(d);

    document.getElementById("btn-rdv").addEventListener("click", function(){
      var bloc = document.getElementById("bloc-rdv");
      bloc.scrollIntoView({ behavior: "smooth", block: "center" });
      var inp = document.getElementById("rdv-creneau");
      if (inp) setTimeout(function(){ inp.focus(); }, 500);
    });

    // Adresse : ouverture de Maps au clic sur la carte, demande d'adresse sinon
    Array.prototype.forEach.call(document.querySelectorAll(".carte"), function(el){
      el.addEventListener("click", function(){
        window.open("https://www.google.com/maps/search/?api=1&query=" + el.getAttribute("data-q"), "_blank", "noopener");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".adr-demande"), function(btn){
      btn.addEventListener("click", function(){
        var i = parseInt(btn.getAttribute("data-adr"), 10);
        envoyer({ action: "adresse", index: i }, "\u2713 Demande transmise — votre conseiller vous donne l'adresse très vite").then(function(ok){
          if (!ok) return;
          etatAvis[String(i)] = etatAvis[String(i)] || {};
          etatAvis[String(i)].adresse_demandee = true;
          btn.disabled = true;
          btn.textContent = "\u2713 Adresse demandée — votre conseiller revient vers vous";
        });
      });
    });
    poserCartes();

    // Comparateur
    var compInvite = document.getElementById("comp-ouvrir");
    if (compInvite) compInvite.addEventListener("click", ouvrirComp);
    document.getElementById("btn-comp").addEventListener("click", ouvrirComp);
    document.getElementById("comp-x").addEventListener("click", fermerComp);
    document.getElementById("comp").addEventListener("click", function(e){ if (e.target === this) fermerComp(); });

    // Lightbox
    document.getElementById("lb-x").addEventListener("click", fermerLb);
    document.getElementById("lb-prec").addEventListener("click", function(){ lbIdx--; majLb(); });
    document.getElementById("lb-suiv").addEventListener("click", function(){ lbIdx++; majLb(); });
    document.getElementById("lb").addEventListener("click", function(e){ if (e.target === this) fermerLb(); });
    document.addEventListener("keydown", function(e){
      if (document.getElementById("lb").classList.contains("show")){
        if (e.key === "Escape") fermerLb();
        if (e.key === "ArrowLeft"){ lbIdx--; majLb(); }
        if (e.key === "ArrowRight"){ lbIdx++; majLb(); }
      } else if (document.getElementById("comp").classList.contains("show") && e.key === "Escape") fermerComp();
    });
    (function(){
      var lb = document.getElementById("lb"), x0 = null;
      lb.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", function(e){
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40){ lbIdx += (dx < 0 ? 1 : -1); majLb(); }
        x0 = null;
      }, { passive: true });
    })();

    // Partage
    document.getElementById("btn-partage").addEventListener("click", function(){
      var url = location.href;
      if (navigator.share){
        navigator.share({ title: "Ma sélection GLR Immobilier", url: url }).catch(function(){});
      } else if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ toast("✓ Lien copié — partagez-le à qui vous voulez"); });
      } else {
        toast(url);
      }
    });
  }

  // ---------- Chargement ----------
  if (token === "demo"){ rendre(donneesDemo()); return; }

  if (apercu){
    var bandeau = document.createElement("div");
    bandeau.style.cssText = "position:fixed;top:0;left:0;right:0;background:#1a1d23;color:#c8a96e;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:7px 10px;z-index:100";
    bandeau.textContent = "Aperçu conseiller — cette visite n'est pas comptée, les clics ne sont pas transmis";
    document.body.appendChild(bandeau);
    document.body.style.paddingTop = "30px";
  }

  fetch(FN + "?data=1" + (apercu ? "&apercu=1" : ""))
  .then(function(r){
    if (r.status === 404) throw { code: 404 };
    if (!r.ok) throw {};
    return r.json();
  })
  .then(function(d){
    if (!d || !d.ok) throw { code: 404 };
    if (d.expired){
      ecranVide("Cette sélection a expiré",
        "Pour recevoir une sélection à jour des meilleures opportunités du moment, contactez " + (d.vendeur || "votre conseiller") + " — GLR Immobilier. Les prix et disponibilités évoluent vite !");
      return;
    }
    rendre(d);
  })
  .catch(function(e){
    if (e && e.code === 404) ecranVide("Lien introuvable", "Ce lien de sélection n'existe pas ou a expiré. Rapprochez-vous de votre conseiller GLR Immobilier.");
    else ecranVide("Erreur de chargement", "Impossible de charger votre sélection — vérifiez votre connexion et réessayez.");
  });
})();
</script>

<script>
/* ============ MISE À JOUR SILENCIEUSE DE LA PAGE SÉLECTION ============
   Surveille l'empreinte (ETag) du fichier servi par GitHub Pages. Quand
   une nouvelle version est en ligne, la page ne se recharge QUE lorsque
   le client a quitté l'onglet — jamais pendant qu'il lit. La position de
   lecture est restaurée à son retour. Aucun message technique affiché.
   ===================================================================== */
(function () {
  'use strict';

  var INTERVALLE      = 90000;
  var INTERVALLE_CONF = 8000;
  var CLE_SCROLL = 'glr-sel-scroll';
  var URL_PAGE = location.pathname;

  /* --- 1. Restauration de la position après un rechargement silencieux --- */
  try {
    var brut = sessionStorage.getItem(CLE_SCROLL);
    if (brut) {
      sessionStorage.removeItem(CLE_SCROLL);
      var sauve = JSON.parse(brut);
      if (sauve && sauve.y > 0 && Date.now() - sauve.t < 7200000) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var essais = 0;
        var rendu = setInterval(function () {
          if (++essais > 40) { clearInterval(rendu); return; }  // 8 s max
          var hauteur = document.documentElement.scrollHeight;
          if (hauteur >= sauve.y + window.innerHeight * 0.5) {
            window.scrollTo(0, sauve.y);
            if (Math.abs(window.pageYOffset - sauve.y) < 4) clearInterval(rendu);
          }
        }, 200);
      }
    }
  } catch (e) {}

  /* --- 2. Surveillance de la version en ligne --- */
  var reference = null, candidat = null, prete = false, timer = null;

  function empreinte(r) {
    return r.headers.get('ETag') || r.headers.get('Last-Modified') || null;
  }

  function programmer(delai) { clearTimeout(timer); timer = setTimeout(verifier, delai); }

  function verifier() {
    if (prete) return;
    if (navigator.onLine === false) { programmer(INTERVALLE); return; }
    fetch(URL_PAGE + '?_maj=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { programmer(INTERVALLE); return; }
        var e = empreinte(r);
        if (!e) { console.log('[MAJ] en-tete ETag indisponible - surveillance inactive'); return; }
        if (reference === null) { reference = e; console.log('[MAJ] surveillance active'); programmer(INTERVALLE); return; }
        if (e === reference)    { candidat = null; programmer(INTERVALLE); return; }
        if (e === candidat)     { prete = true; if (document.hidden) recharger(); return; }
        candidat = e; programmer(INTERVALLE_CONF);
      })
      .catch(function () { programmer(INTERVALLE); });
  }

  function recharger() {
    try {
      sessionStorage.setItem(CLE_SCROLL, JSON.stringify({ y: window.pageYOffset || 0, t: Date.now() }));
    } catch (e) {}
    location.reload();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && prete) recharger();
  });

  programmer(5000);
})();
</script>
